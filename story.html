<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7eed0">
<title>遺落成華｜小故事</title>

<!--
  素材（全部 png，放在 images/；沒放圖時會顯示色票佔位框，可先測流程）
  背景     background1.png（門口）／ background2.png（房間）／ background3.png（窗戶），cover 鋪滿
  畫面一   door 門 ／ nameplate 門牌 ／ mailbox 信箱 ／ mailbox2 信箱（放入信封）／ claim 領信畫面插圖（可省略）
  畫面二   window 窗戶 ／ bookshelf 書架 ／ bed 床
           bird1、bird2、bird3 三張鳥影（尺寸與 window.png 完全相同，會重疊在窗戶上依序快速切換）
  畫面三   windowbig 大窗戶 ／ btn-back 返回按鈕
  畫面四   background4 ／ book-cover 書封面、book-open 書翻開、book-page 書內頁（三張同尺寸，會有翻頁效果）／ flower1 洋甘菊、flower2 桔梗花、flower3 繡球花、flower4 櫻花（滿版，提到時整個畫面角色登場；
           直式 flowerN.png 1080×1920，橫式 flowerN-wide.png 1920×1080 可省略，沒有橫式就用直式）
  畫面五   背景直接是黑色 ／ keeper 管理員鳥
  其他     btn-menu 選單按鈕（可省略）／ talk1、talk2 對話框（可省略）
  貼紙位置與大小：改下方 CSS 的 #plate #door #mail #win #shelf #bed（x、y、w 是占版面的百分比，r 是旋轉角度）。
-->

<script>
function imgOk(i){ i.parentElement.classList.remove('empty'); }
function imgMiss(i){
  const p = i.parentElement, f = i.getAttribute('src');
  p.classList.add('empty'); p.dataset.file = f;
  console.warn('找不到圖片：' + f);
}
</script>
<style>
  @font-face {
    font-family: "HanyiSentyCrayon";
    src: url("fonts/HanyiSentyCrayon-non-color.woff2") format("woff2");
    font-display: swap;
  }
  :root {
    --blue:#789baa; --rose:#e1beb9; --cream:#f7eed0; --blush:#f1e0e4; --lav:#ede2ef;
    --ink:#3d535d; --night:#1f2b31;
    --font:"HanyiSentyCrayon","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    --top:64px;      /* 頂部留給選單按鈕 */
    --em:clamp(22px,min(1.5vw + 11px,4.6svh),34px);   /* 對話框文字大小（手機 22px → 電腦約 32px） */
    --dlg:calc(var(--em) * 5.1 + 86px);                /* 對話框最高約 3 行的高度（手機直式） */
    --talk:0px;                                        /* 預設不保留：對話框可蓋住圖片，要點選時對話框已消失 */
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    --bg:url("images/background1.png");
    font-family:var(--font);color:var(--ink);overflow:hidden;
    -webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation;
    background:var(--bg) center/cover no-repeat fixed,
               linear-gradient(160deg,var(--cream),var(--blush) 50%,var(--lav));
  }
  body.night{background:#000}
  body.reserve{--talk:var(--dlg)}                 /* 畫面四：書本與花卉要看得到，所以保留對話框空間 */
  .hid{display:none!important}
  button{font:inherit;color:inherit;cursor:pointer}

  /* ───── 版面：貼紙牆（比例依裝置切換，大小跟著螢幕走）───── */
  .page{min-height:100svh;display:flex;justify-content:center;align-items:flex-start;padding-top:var(--top)}
  .wall{
    position:relative;container-type:inline-size;aspect-ratio:5/9;
    width:min(94vw, calc((100svh - var(--top) - var(--talk)) * 0.5556), 560px);
  }
  /* 手機直式 / 平板直式（牆比例 5:9；x、w 是占牆寬的百分比，y 是占牆高的百分比） */
  #plate{--x:25%;--y:3%; --w:50%;--r:2deg;   --ar:3/2}
  #door {--x:3%; --y:23%;--w:62%;--r:-1.5deg;--ar:3/5}
  #mail {--x:60%;--y:52%;--w:38%;--r:3deg;   --ar:4/5}
  #win  {--x:44%;--y:4%; --w:54%;--r:1.5deg; --ar:4/5}
  #shelf{--x:2%; --y:19%;--w:46%;--r:-2deg;  --ar:3/5}
  #bed  {--x:3%; --y:63%;--w:94%;--r:1deg;   --ar:3/2}
  #bigwin{--x:4%;--y:3%; --w:92%;--r:0deg;   --ar:4/5}
  #back {--x:24%;--y:76%;--w:52%;--r:0deg;   --ar:3/1}
  #book {--x:2%; --y:14%;--w:96%;--r:0deg;   --ar:4/3}
  #back4{--x:24%;--y:76%;--w:52%;--r:0deg;   --ar:3/1}
  #keeper{--x:10%;--y:22%;--w:80%;--r:0deg;  --ar:1/1}
  /* 電腦 / 平板 / 手機橫放（牆比例 16:10） */
  @media (min-aspect-ratio:1/1){
    :root{--top:12px;--dlg:calc(var(--em) * 3.4 + 86px)}
    .page{align-items:center;padding-bottom:calc(var(--talk) + 12px)}
    .wall{aspect-ratio:16/10;width:min(94vw, calc((100svh - var(--top) - var(--talk) - 12px) * 1.6), 1400px)}
    #plate{--x:10%;--y:38%;--w:24%}
    #door {--x:36%;--y:12%;--w:28%}
    #mail {--x:68%;--y:40%;--w:22%}
    #win  {--x:56%;--y:4%; --w:26%}
    #shelf{--x:12%;--y:8%; --w:20%}
    #bed  {--x:30%;--y:52%;--w:40%}
    #bigwin{--x:28%;--y:4%;--w:44%}
    #back {--x:76%;--y:78%;--w:18%}
    #book {--x:21%;--y:8%; --w:58%}
    #back4{--x:76%;--y:82%;--w:18%}
    #keeper{--x:33%;--y:12%;--w:34%}
  }

  /* ───── 貼紙 ───── */
  .sticker{
    position:absolute;left:var(--x);top:var(--y);width:var(--w);margin:0;padding:0;border:0;background:none;
    container-type:inline-size;
    transform:rotate(var(--r)) translateY(var(--lift,0));
    filter:drop-shadow(0 .5cqw .8cqw rgba(61,83,93,.3));
    transition:transform .18s ease;
  }
  div.sticker{pointer-events:none}
  .sticker img{display:block;width:100%;height:auto;pointer-events:none}
  .sticker:hover{--lift:-2.5cqw}
  .sticker:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
  .sticker .lbl{display:none}
  .sticker.empty{aspect-ratio:var(--ar);display:grid;place-items:center;
    background:rgba(241,224,228,.8);border:3px dashed var(--blue);border-radius:14px}
  .sticker.empty img{display:none}
  .sticker.empty .lbl{display:block;font-size:18cqw;color:var(--blue)}
  .sticker.empty::after{content:attr(data-file);position:absolute;left:0;right:0;bottom:5cqw;text-align:center;font-size:7cqw;color:var(--blue)}
  .nm{position:absolute;inset:0;display:grid;place-items:center;font-size:14cqw;white-space:nowrap;pointer-events:none}
  .glow{animation:glow 1.8s ease-in-out infinite}
  @keyframes glow{0%,100%{filter:drop-shadow(0 0 4px var(--cream))}50%{filter:drop-shadow(0 0 2.5cqw #fff)}}
  .shake{animation:shake .35s}
  @keyframes shake{25%{transform:rotate(var(--r)) translateX(-6px)}75%{transform:rotate(var(--r)) translateX(6px)}}

  /* 引導：直接出現在物件旁，純文字＋小箭頭（沒有外框，避免看起來像按鈕） */
  .cue{display:none;position:absolute;left:50%;bottom:calc(100% + 6px);flex-direction:column;align-items:center;
    transform:translateX(-50%);white-space:nowrap;pointer-events:none;
    font-size:clamp(17px,1.1vw + 11px,26px);line-height:1.3;color:var(--cream);
    text-shadow:0 0 3px var(--ink),0 0 3px var(--ink),0 1px 8px rgba(31,43,49,.7);
    animation:cuebob 1.1s ease-in-out infinite}
  .cue::after{content:"";margin-top:2px;border-left:9px solid transparent;border-right:9px solid transparent;
    border-top:12px solid var(--cream);filter:drop-shadow(0 1px 2px rgba(31,43,49,.6))}
  .hinted .cue{display:flex}
  .cue-below .cue{bottom:auto;top:calc(100% + 6px);flex-direction:column-reverse}
  .cue-below .cue::after{margin:0 0 2px;border-top:0;border-bottom:12px solid var(--cream)}
  @keyframes cuebob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,6px)}}

  /* 鳥影：三張與窗戶同大的圖重疊在窗戶上，依序快速切換，並加上震動 */
  .sky{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  #bird{display:none;position:absolute;inset:0;color:var(--night)}
  #bird.fly{display:block;animation:jit .1s linear infinite}
  #bird img,#bird svg{display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  #bird svg{inset:32% 18%;width:64%;height:36%;fill:currentColor;opacity:.85}
  #bird .on{display:block}
  @keyframes jit{
    0%,100%{transform:translate(0,0) rotate(0)}
    25%{transform:translate(2cqw,-1.5cqw) rotate(.8deg)}
    50%{transform:translate(-1.8cqw,1.4cqw) rotate(-.8deg)}
    75%{transform:translate(1.4cqw,1.2cqw) rotate(.5deg)}}

  /* 畫面四：書本（封面 → 翻開 → 內頁，換頁時舊的一頁翻走）。翻頁轉軸可改 --pivot，例如 50% 50% */
  #book{aspect-ratio:var(--ar);perspective:1400px}
  .bk{position:absolute;inset:0;display:none;z-index:1;backface-visibility:hidden}
  .bk.show{display:block}
  .bk img{display:block;width:100%;height:100%;object-fit:contain}
  .bk .lbl{display:none}
  .bk.empty{border:3px dashed var(--blue);border-radius:14px;background:rgba(241,224,228,.8);place-items:center}
  .bk.empty.show{display:grid}
  .bk.empty img{display:none}
  .bk.empty .lbl{display:block;font-size:12cqw;color:var(--blue)}
  .bk.empty::after{content:attr(data-file);position:absolute;left:0;right:0;bottom:3cqw;text-align:center;font-size:4cqw;color:var(--blue)}
  .bk.turning{z-index:2;transform-origin:var(--pivot,left center);animation:turn .8s ease-in-out forwards}
  @keyframes turn{from{transform:rotateY(0);filter:brightness(1)}to{transform:rotateY(-110deg);filter:brightness(.7)}}

  /* 畫面四：花卉角色登場（滿版 cover，蓋在場景最上方、對話框下方） */
  #flower{position:fixed;inset:0;z-index:28;pointer-events:none}
  #flower img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
  #flower .ph{display:none;position:absolute;inset:0;place-items:center;text-align:center;padding:16px;
    font-size:clamp(22px,3vw + 8px,34px);color:var(--blue);background:rgba(241,224,228,.85);border:3px dashed var(--blue)}
  #flower.empty img{display:none} #flower.empty .ph{display:grid}
  #flower.enter{animation:enter .55s cubic-bezier(.2,.9,.3,1.25)}
  @keyframes enter{from{opacity:0;transform:translateY(8%) scale(.96)}to{opacity:1;transform:none}}
  .popin{animation:popin .6s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes popin{from{scale:.6;opacity:0}to{scale:1;opacity:1}}

  /* 轉場 */
  #curtain{position:fixed;inset:0;z-index:35;background:var(--cream);opacity:0;pointer-events:none;transition:opacity .5s}
  #curtain.on{opacity:1;pointer-events:auto}

  /* ───── 選單 ───── */
  #menu-btn{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:calc(env(safe-area-inset-left) + 10px);z-index:50;
    width:clamp(44px,7vmin,60px);aspect-ratio:1;padding:0;border:2.5px solid var(--blue);border-radius:50%;
    background:rgba(247,238,208,.95);display:grid;place-items:center;overflow:hidden}
  #menu-btn img{width:100%;height:100%;object-fit:cover;display:block}
  #menu-btn .t{display:none;font-size:14px}
  #menu-btn.empty img{display:none} #menu-btn.empty .t{display:block}
  #menu{position:fixed;z-index:50;top:calc(env(safe-area-inset-top) + 74px);left:calc(env(safe-area-inset-left) + 10px);
    display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:18px;background:var(--cream);border:2.5px solid var(--blue)}
  #menu a,#menu button{display:block;text-align:center;text-decoration:none;font-size:20px;padding:8px 22px;
    border-radius:12px;border:2px solid var(--rose);background:var(--blush);color:var(--ink)}
  #menu a:hover,#menu button:hover{background:var(--lav)}
  #menu-btn:focus-visible,#menu a:focus-visible,#menu button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

  /* ───── 對話框（含上一句 / 下一句）───── */
  #talk{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));
    font-size:var(--em);line-height:1.7;line-break:strict;
    width:min(92vw,19em);padding:12px 1em 10px;border-radius:26px;display:flex;flex-direction:column;gap:4px;
    border:3px solid var(--blue);background:var(--tb);cursor:pointer;box-shadow:0 6px 0 rgba(120,155,170,.35)}
  #talk[data-w="1"]{--tb:var(--rose)} #talk[data-w="2"]{--tb:var(--cream)}
  #talk-img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:none;border-radius:inherit}
  #talk.img{background:none;border-color:transparent;box-shadow:none}
  #talk.img #talk-img{display:block}
  #talk-text{position:relative}
  .ctrl{position:relative;align-self:flex-end;display:flex;gap:8px}
  .ctrl button{font-size:clamp(16px,.6vw + 12px,20px);padding:2px 16px;border-radius:999px;
    border:2px solid var(--blue);background:var(--blush);color:var(--ink)}
  .ctrl button:hover{background:var(--lav)}
  .ctrl button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
  .ch{opacity:0}
  .ch.on{opacity:1;transition:opacity .15s}

  /* ───── 彈出視窗：輸入名字、領信 ───── */
  #modal,#claim{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;
    background:rgba(61,83,93,.45);backdrop-filter:blur(3px)}
  .mbox,.cbox{width:min(92vw,480px);padding:28px;border-radius:24px;background:var(--cream);border:3px solid var(--blue);text-align:center}
  .cbox{max-height:92svh;overflow:auto}
  .cbox img{display:block;width:100%;height:auto;border-radius:14px;margin-bottom:14px}
  .cbox h3{margin:0 0 4px;font-size:clamp(26px,1vw + 20px,32px);font-weight:normal}
  .cbox .cname{margin:0 0 10px;font-size:clamp(30px,1vw + 24px,36px);color:var(--blue)}
  .cbox p{margin:8px 0;font-size:clamp(22px,1vw + 16px,28px);line-height:1.6}
  .cbox .small{font-size:clamp(19px,.8vw + 14px,23px);color:var(--blue)}
  #claim-close{margin-top:14px;font-size:clamp(21px,.6vw + 16px,25px);padding:10px 28px;border-radius:14px;border:0;background:var(--blue);color:var(--cream)}
  #claim-close:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  .mbox h3{margin:0 0 16px;font-size:24px;font-weight:normal}
  .mbox input{width:100%;font:inherit;font-size:22px;text-align:center;padding:10px;border-radius:14px;
    border:2.5px solid var(--rose);background:#fff;color:var(--ink);user-select:text}
  .mbox input:focus{outline:3px solid var(--blue)}
  #err{min-height:30px;margin:8px 0;font-size:18px;color:#a0524a}
  #ok{font-size:22px;padding:10px 40px;border-radius:14px;border:0;background:var(--blue);color:var(--cream)}
  #ok:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

  @media (prefers-reduced-motion:reduce){
    .glow,.shake,.cue,.popin,#flower.enter,.bk.turning{animation:none} .ch.on{transition:none} .sticker,#curtain{transition:none}
  }
</style>
</head>

<body>
<main class="page">

  <!-- 畫面一：門口 -->
  <div class="wall" id="s1">
    <button class="sticker" id="plate" type="button" aria-label="門牌">
      <img src="images/nameplate.png" alt="" onload="imgOk(this)" onerror="imgMiss(this)">
      <span class="lbl">門牌</span><span class="nm"></span><span class="cue"><span class="cue-t"></span></span>
    </button>
    <button class="sticker cue-below" id="door" type="button" aria-label="大門">
      <img src="images/door.png" alt="" onload="imgOk(this)" onerror="imgMiss(this)">
      <span class="lbl">大門</span><span class="cue"><span class="cue-t"></span></span>
    </button>
    <button class="sticker" id="mail" type="button" aria-label="信箱">
      <img src="images/mailbox.png" alt="" onload="imgOk(this)" onerror="imgMiss(this)">
      <span class="lbl">信箱</span><span class="cue"><span class="cue-t"></span></span>
    </button>
  </div>

  <!-- 畫面二：房間 -->
  <div class="wall hid" id="s2">
    <button class="sticker" id="shelf" type="button" aria-label="書架">
      <img src="images/bookshelf.png" alt="" onload="imgOk(this)" onerror="imgMiss(this)">
      <span class="lbl">書架</span><span class="cue"><span class="cue-t"></span></span>
    </button>
    <button class="sticker" id="win" type="button" aria-label="窗戶">
      <img src="images/window.png" alt="" onload="imgOk(this)" onerror="imgMiss(this)">
      <span class="lbl">窗戶</span>
      <span class="sky" aria-hidden="true"><span id="bird">
        <img src="images/bird1.png" alt=""><img src="images/bird2.png" alt=""><img src="images/bird3.png" alt="">
        <svg viewBox="0 0 64 32"><path d="M2 14Q18 0 32 15Q46 0 62 14Q46 10 32 26Q18 10 2 14Z"/></svg>
      </span></span>
      <span class="cue"><span class="cue-t"></span></span>
    </button>
    <button class="sticker" id="bed" type="button" aria-label="床">
      <img src="images/bed.png" alt="" onload="imgOk(this)" onerror="imgMiss(this)">
      <span class="lbl">床</span><span class="cue"><span class="cue-t"></span></span>
    </button>
  </div>

  <!-- 畫面三：窗戶 -->
  <div class="wall hid" id="s3">
    <div class="sticker" id="bigwin">
      <img src="images/windowbig.png" alt="" onload="imgOk(this)" onerror="imgMiss(this)">
      <span class="lbl">大窗戶</span>
    </div>
    <button class="sticker cue-below hid" id="back" type="button" aria-label="返回房間">
      <img src="images/btn-back.png" alt="" onload="imgOk(this)" onerror="imgMiss(this)">
      <span class="lbl">返回房間</span><span class="cue"><span class="cue-t"></span></span>
    </button>
  </div>

  <!-- 畫面四：書本 -->
  <div class="wall hid" id="s4">
    <div class="sticker" id="book">
      <div class="bk"><img src="images/book-cover.png" alt="" onload="imgOk(this)" onerror="imgMiss(this)"><span class="lbl">書封面</span></div>
      <div class="bk"><img src="images/book-open.png" alt="" onload="imgOk(this)" onerror="imgMiss(this)"><span class="lbl">書翻開</span></div>
      <div class="bk"><img src="images/book-page.png" alt="" onload="imgOk(this)" onerror="imgMiss(this)"><span class="lbl">書內頁</span></div>
    </div>
    <button class="sticker cue-below hid" id="back4" type="button" aria-label="返回房間">
      <img src="images/btn-back.png" alt="" onload="imgOk(this)" onerror="imgMiss(this)">
      <span class="lbl">返回房間</span><span class="cue"><span class="cue-t"></span></span>
    </button>
  </div>

  <!-- 畫面五：入睡（背景純黑） -->
  <div class="wall hid" id="s5">
    <div class="sticker" id="keeper">
      <img src="images/keeper.png" alt="" onload="imgOk(this)" onerror="imgMiss(this)">
      <span class="lbl">管理員鳥</span>
    </div>
  </div>

</main>

<div id="flower" class="hid" aria-hidden="true">
  <img alt="">
  <div class="ph"></div>
</div>
<div id="curtain"></div>

<button id="menu-btn" type="button" aria-label="選單" aria-expanded="false">
  <img src="images/btn-menu.png" alt="" onerror="this.parentElement.classList.add('empty')">
  <span class="t">選單</span>
</button>
<nav id="menu" class="hid">
  <a href="index.html">回到首頁</a>
  <button type="button" id="reset">重新開始</button>
</nav>

<div id="talk" class="hid" data-w="2">
  <img id="talk-img" alt="">
  <div id="talk-text"></div>
  <div class="ctrl">
    <button type="button" id="prev">‹ 上一句</button>
    <button type="button" id="next">下一句 ›</button>
  </div>
</div>

<div id="modal" class="hid">
  <div class="mbox">
    <h3>請在此寫下你的名字...</h3>
    <input id="inp" type="text" maxlength="20" placeholder="請輸入名字" autocomplete="off" enterkeyhint="done" aria-label="名字">
    <div id="err" role="alert"></div>
    <button type="button" id="ok">確認</button>
  </div>
</div>

<div id="claim" class="hid" role="dialog" aria-modal="true" aria-labelledby="claim-title">
  <div class="cbox">
    <img src="images/claim.png" alt="" onerror="this.classList.add('hid')">
    <h3 id="claim-title">領取信件</h3>
    <p class="cname" id="claim-name"></p>
    <p>請帶著這個畫面，來找我們領取你的信件。</p>
    <p class="small">領完信件後，再按下方按鈕關閉畫面。</p>
    <button type="button" id="claim-close">已領取信件，關閉畫面</button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const show = (el, v = true) => el.classList.toggle('hid', !v);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* 名字與進度暫存：同一分頁內，之後的頁面也讀得到 */
const mem = {};
const store = {
  set(k, v) { mem[k] = v; try { sessionStorage.setItem(k, v); } catch (e) {} },
  get(k) { try { return sessionStorage.getItem(k) || mem[k] || null; } catch (e) { return mem[k] || null; } },
  reset() { for (const k in mem) delete mem[k];
    try { ['user_name', 'story_stage', 'selected_theme'].forEach(k => sessionStorage.removeItem(k)); } catch (e) {} }
};

/* ───── 對話框：打字機效果＋上一句 / 下一句 ───── */
const talk = $('#talk'), tt = $('#talk-text'), ti = $('#talk-img'), prev = $('#prev'), next = $('#next');
let Q = [], qi = 0, done = null, typing = false, tm = null, full = '';
ti.onload = () => talk.classList.add('img');
ti.onerror = () => talk.classList.remove('img');

function say(list, d) {
  Q = list.map(x => ({ w: 2, ...(typeof x === 'string' ? { t: x } : x) }));
  qi = 0; done = d || null; show(talk); line(false); next.focus({ preventScroll: true });
}
let chars = [];
function render(text) {            // 先把整句排好（文字隱藏），對話框大小從一開始就固定
  tt.textContent = ''; chars = [];
  for (const c of text) { const e = document.createElement('span'); e.className = 'ch'; e.textContent = c; tt.append(e); chars.push(e); }
}
function line(instant) {
  const x = Q[qi];
  talk.dataset.w = x.w; talk.classList.remove('img'); ti.src = `images/talk${x.w}.png`;
  prev.classList.toggle('hid', qi === 0);
  next.textContent = qi === Q.length - 1 ? '結束' : '下一句 ›';
  clearTimeout(tm); full = x.t; render(full);
  if (x.view) x.view(instant);                                     // 每次顯示這句都會執行（含退回上一句）
  if (instant) { chars.forEach(c => c.classList.add('on')); typing = false; return; }   // 退回上一句：直接顯示
  if (x.run) x.run();                                              // 這句開始時執行
  typing = true; let i = 0;
  (function step() {
    if (!typing) return;
    if (i < chars.length) {
      const c = chars[i++]; c.classList.add('on');
      tm = setTimeout(step, '，、'.includes(c.textContent) ? 130 : '。！？'.includes(c.textContent) ? 220 : 42);
    } else { typing = false; endLine(); }
  })();
}
function endLine() {               // 這句完整顯示後執行（只會執行一次）
  const x = Q[qi];
  if (x && x.after && !x.fired) { x.fired = true; x.after(); }
}
function finishTyping() { clearTimeout(tm); chars.forEach(c => c.classList.add('on')); typing = false; endLine(); }
function go(d) {
  if (d < 0) { if (qi > 0) { qi--; line(true); } else if (typing) finishTyping(); return; }
  if (typing) { finishTyping(); return; }
  if (++qi < Q.length) line(false);
  else { show(talk, false); const f = done; done = null; if (f) f(); }
}
talk.addEventListener('click', () => go(1));
prev.addEventListener('click', e => { e.stopPropagation(); go(-1); });
next.addEventListener('click', e => { e.stopPropagation(); go(1); });
document.addEventListener('keydown', e => {
  if (talk.classList.contains('hid') || !$('#modal').classList.contains('hid')) return;
  if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1);
});

let busy = false;
const talking = () => busy || ['#talk', '#modal', '#claim'].some(q => !$(q).classList.contains('hid'));

/* ───── 引導：提示直接出現在物件旁，並讓該物件發光 ───── */
const plate = $('#plate'), door = $('#door'), mail = $('#mail'), win = $('#win'), shelf = $('#shelf'), bed = $('#bed'), back = $('#back'), back4 = $('#back4');
const TIPS = { name: [plate, '寫下暱稱'], mail: [mail, '領取信件'], door: [door, '進入房間'],
               win: [win, '看看窗外'], shelf: [shelf, '翻找書架'], back: [back, '回到房間'],
               bed: [bed, '準備休息'], back4: [back4, '回到房間'] };
function guide(el, text) {
  document.querySelectorAll('.sticker').forEach(x => x.classList.remove('hinted', 'glow'));
  if (!el) return;
  el.querySelector('.cue-t').textContent = text;
  el.classList.add('hinted', 'glow');
}
function nudge(el) {
  el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
  el.addEventListener('animationend', () => el.classList.remove('shake'), { once: true });
}
let step = 0;   // 畫面一：0 寫下名字 → 1 領取信件 → 2 進入大門

/* ───── 畫面一：門牌（寫名字）───── */
const modal = $('#modal'), inp = $('#inp'), err = $('#err'), claim = $('#claim');
let composing = false;

plate.addEventListener('click', () => {
  if (talking() || step > 0) return;
  show(modal); inp.value = ''; err.textContent = ''; setTimeout(() => inp.focus(), 100);
});
function check(t) {
  if (!t) return '名字不能為空喔！';
  if (/[^\u4e00-\u9fffA-Za-z0-9]/.test(t)) return '請勿包含特殊符號！';
  const zh = (t.match(/[\u4e00-\u9fff]/g) || []).length;
  if (zh > 5) return '中文字數最多限制 5 個字';
  if (t.length - zh > 10) return '英文字數最多限制 10 個字';
  return '';
}
function liveCheck() {                       // 邊輸入邊提醒（注音/拼音選字中不檢查）
  if (composing) return;
  const v = inp.value.trim();
  err.textContent = v ? check(v) : '';
}
function submitName() {
  const v = inp.value.trim(), r = check(v);
  if (r) { err.textContent = r; return; }
  inp.blur(); store.set('user_name', v); step = 1;
  plate.querySelector('.nm').textContent = v;
  show(modal, false); guide(null);
  mail.querySelector('img').src = 'images/mailbox2.png';          // 信箱換成「放入信封」的造型
  mail.querySelector('.lbl').textContent = '信箱（有信）';
  say([{ t: `${v}嗨！信箱裡好像放了一封信，去看看吧！`, w: 2 }],   /* 文字可自行修改 */
      () => guide(...TIPS.mail));
}
$('#ok').addEventListener('click', submitName);
inp.addEventListener('input', liveCheck);
inp.addEventListener('compositionstart', () => composing = true);
inp.addEventListener('compositionend', () => { composing = false; liveCheck(); });
inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); submitName(); } });

/* ───── 畫面一：信箱（領信畫面）───── */
mail.addEventListener('click', () => {
  if (talking()) return;
  if (step === 0) { nudge(mail); guide(...TIPS.name); return; }
  $('#claim-name').textContent = store.get('user_name') || '';
  show(claim); $('#claim-close').focus();
});
$('#claim-close').addEventListener('click', () => {
  show(claim, false);
  if (step === 1) { step = 2; guide(...TIPS.door); }               // 領完信才能進大門
});

/* ───── 畫面一：大門 → 畫面二 ───── */
door.addEventListener('click', () => {
  if (talking()) return;
  if (step < 2) { nudge(door); guide(...(step ? TIPS.mail : TIPS.name)); return; }
  enterRoom();
});

/* ───── 畫面二：房間 ───── */
const ROOM = [
  '現在是晚上12:10',
  '在這個時間點，深夜裡的寂靜被無限放大',
  '有些不太容易覺察的情緒正在心頭緩緩地流動著',
  '開心？憤怒？悲傷？還是焦慮？',
  { t: '這模糊不清的感受...', after: triggerBirdSequence },          // 第 5 句完整顯示後，鳥影才飛過
  '咦..！窗外剛剛飛過什麼東西？！'
];
let birdDone = false, roomReady = false, roomPhase = 0;   // roomPhase：1 去看窗戶 → 2 去翻書架
const BIRD_MS = 800;                                       // 鳥影整段動畫時間（0.8 秒）

function triggerBirdSequence() {
  if (birdDone || reduce) return;
  birdDone = true;
  const b = $('#bird');
  const fr = [...b.querySelectorAll('img')].filter(i => i.complete && i.naturalWidth);
  if (!fr.length) fr.push(b.querySelector('svg'));          // 沒放圖時用黑色小鳥代替
  const per = BIRD_MS / Math.max(fr.length, 3);
  b.classList.add('fly');
  fr.forEach((f, i) => setTimeout(() => { fr.forEach(x => x.classList.remove('on')); f.classList.add('on'); }, i * per));
  setTimeout(() => { b.classList.remove('fly'); fr.forEach(x => x.classList.remove('on')); }, BIRD_MS);
}

/* 場景切換（淡入淡出）。bg 傳 null 代表純黑背景 */
function goScene(from, to, bg, after, color = 'var(--cream)', ms = 550) {
  busy = true; guide(null); showFlower(0);
  const c = $('#curtain'); c.style.background = color; c.style.transitionDuration = ms + 'ms'; c.classList.add('on');
  setTimeout(() => {
    show($(from), false); show($(to));
    document.body.classList.toggle('reserve', to === '#s4');
    document.body.classList.toggle('night', !bg);
    if (bg) document.body.style.setProperty('--bg', `url("images/${bg}.png")`);
    c.classList.remove('on');
    setTimeout(() => { busy = false; if (after) after(); }, ms);
  }, ms);
}
function enterRoom() {
  store.set('story_stage', 'room');
  goScene('#s1', '#s2', 'background2', () => say(ROOM, () => { roomReady = true; roomPhase = 1; guide(...TIPS.win); }));
}
const ROOM_TIPS = [null, TIPS.win, TIPS.shelf, TIPS.bed];
[win, shelf, bed].forEach(el => el.addEventListener('click', () => {
  if (talking() || !roomReady) return;
  const t = ROOM_TIPS[roomPhase];
  if (el !== t[0]) { nudge(el); guide(...t); return; }              // 還沒輪到：抖一下並指回該點的物件
  [null, enterWindow, enterBook, enterSleep][roomPhase]();
}));

/* ───── 畫面三：窗戶 ───── */
const WINDOW = [
  '剛剛好像有什麼東西跑過去...',
  '跑得太快了吧，怎麼現在連個影子都沒有',
  '恩...？這個盆栽...似乎已經很久都沒有種東西',
  '是什麼時候開始忘記這個興趣呢...',
  '那現在來種點什麼好了',
  '我想想...之前書櫃好像放了一本有關花卉的書',
  '去找找看現在適合種什麼吧！'
];
function enterWindow() {
  store.set('story_stage', 'window');
  goScene('#s2', '#s3', 'background3', () => say(WINDOW, () => { show(back); guide(...TIPS.back); }));
}
back.addEventListener('click', () => {
  if (talking()) return;
  show(back, false); roomPhase = 2;
  goScene('#s3', '#s2', 'background2', () => guide(...TIPS.shelf));   // 回到房間，改引導點書架
});

/* ───── 畫面四：書本（提到花卉時，整個畫面出現花卉角色）───── */
const FLOWERS = ['', '洋甘菊', '桔梗花', '繡球花', '櫻花'];
const BOOK = [                      // b：書本狀態 0 封面 / 1 翻開 / 2 內頁；f：出現的花卉
  { t: '這個書名...', b: 0 },
  { t: '讓我看看...', b: 1 },                                            // 封面翻開
  { t: '在每個人的心中，有一座專屬的心靈花園。', b: 1 },
  { t: '洋甘菊——綻放喜悅，幸福、純粹的友誼與陽光般的正能量；', b: 1, f: 1 },
  { t: '桔梗花——守護永恆的愛與真誠不變的情感；', b: 1, f: 2 },
  { t: '繡球花——凝聚在一起的希望，擁抱對未來的憧憬；', b: 1, f: 3 },
  { t: '櫻花——象徵富裕的財富與生活中取捨的智慧。', b: 1, f: 4 },
  { t: '這座心靈花園，只能在入睡時才能看見', b: 2 },                       // 換成內頁
  { t: '請注意，當遺憾盤踞在心中時', b: 2 },
  { t: '花園中的萬物將不再綻放', b: 2 },
  { t: '好神奇啊...不知道我的心靈花園是什麼樣子的呢？', b: 2 },
  { t: '唉呦！先別想了，明天還要早起呢！', b: 2 },
  { t: '來去睡覺吧~', b: 2 }
];
const fl = $('#flower'), fimg = fl.querySelector('img');
let flowerNo = 0, flowerTry = '';
const isWide = () => matchMedia('(min-aspect-ratio: 1/1)').matches;
fimg.onload = () => fl.classList.remove('empty');
fimg.onerror = () => {
  if (flowerTry === 'wide') { flowerTry = 'base'; fimg.src = `images/flower${flowerNo}.png`; }   // 沒有橫式版就改用直式版
  else fl.classList.add('empty');
};
function showFlower(n) {
  if (!n) { show(fl, false); return; }
  flowerNo = n; flowerTry = isWide() ? 'wide' : 'base';
  const f = `flower${n}${flowerTry === 'wide' ? '-wide' : ''}.png`;
  fl.querySelector('.ph').textContent = `${FLOWERS[n]}（${f}）`;
  fimg.src = `images/${f}`;
  show(fl); fl.classList.remove('enter'); void fl.offsetWidth; fl.classList.add('enter');   // 角色登場動畫
}
function popIn(el) { el.classList.remove('popin'); void el.offsetWidth; el.classList.add('popin'); }

/* 書本：封面 → 翻開 → 內頁。換頁時舊的一頁往左翻走，露出下面的新頁 */
const bkItems = [...document.querySelectorAll('#book .bk')];
let bk = 0;
function setBook(k) { bkItems.forEach((e, i) => { e.classList.remove('turning'); e.classList.toggle('show', i === k); }); bk = k; }
function turnTo(k) {
  if (k === bk) return;
  if (reduce) { setBook(k); return; }
  const old = bkItems[bk];
  bkItems.forEach((e, i) => { if (e !== old) { e.classList.remove('turning'); e.classList.toggle('show', i === k); } });
  old.classList.add('show', 'turning'); bk = k;
  old.addEventListener('animationend', () => { if (bkItems[bk] !== old) old.classList.remove('show', 'turning'); }, { once: true });
}

function enterBook() {
  store.set('story_stage', 'book');
  goScene('#s2', '#s4', 'background4', () => {
    setBook(0); popIn($('#book'));
    const lines = BOOK.map(o => ({ ...o, view: inst => { showFlower(o.f || 0); inst ? setBook(o.b) : turnTo(o.b); } }));
    say(lines, () => { showFlower(0); show(back4); guide(...TIPS.back4); });
  });
}
back4.addEventListener('click', () => {
  if (talking()) return;
  show(back4, false); roomPhase = 3;
  goScene('#s4', '#s2', 'background2', () => guide(...TIPS.bed));   // 回到房間，改引導點床
});

/* ───── 畫面五：入睡（背景純黑），管理員鳥出現 ───── */
function enterSleep() {
  store.set('story_stage', 'sleep');
  goScene('#s2', '#s5', null, () => {
    popIn($('#keeper'));
    setTimeout(() => say([`你來啦！${store.get('user_name') || ''}`], () => { /* TODO：接下來的對話與選主題 */ }), 700);
  }, '#000', 900);
}

/* ───── 左上角選單 ───── */
const menuBtn = $('#menu-btn'), menu = $('#menu');
function toggleMenu(v) { show(menu, v); menuBtn.setAttribute('aria-expanded', v); }
menuBtn.addEventListener('click', e => { e.stopPropagation(); toggleMenu(menu.classList.contains('hid')); });
document.addEventListener('click', () => toggleMenu(false));
document.addEventListener('keydown', e => { if (e.key === 'Escape') toggleMenu(false); });
$('#reset').addEventListener('click', () => { store.reset(); location.reload(); });

/* ───── 開始 ───── */
store.reset();
guide(...TIPS.name);
</script>
</body>
</html>
