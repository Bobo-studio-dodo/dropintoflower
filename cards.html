<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>遺落成華｜線上排卡</title>
<style>
/* ===================================================
   可調整的樣式（只改數字即可）
   =================================================== */
:root{

  /* 計分畫面：能力便條紙在卡牌上的位置、大小、角度 */
  --note-x: 50%;      /* 左右（50% = 置中） */
  --note-y: -4%;      /* 上下（負數 = 超出卡片上緣一點） */
  --note-w: 78%;      /* 寬度（相對卡片寬度） */
  --note-rotate: -4deg;

  /* 主題色 */
  --c-F:#b4a149;  /* 友情 */
  --c-L:#a09285;  /* 愛情 */
  --c-P:#80679e;  /* 未來規劃 */
  --c-M:#c78696;  /* 財務管理 */
  --c-O:#607479;  /* 共同因素／其他 */

  /* 配色 */
  --blue:#789baa;
  --pink:#e1beb9;
  --cream:#f7eed0;
  --rose:#f1e0e4;
  --lilac:#ede2ef;
  --ink:#5a4a42;
  --branch:#8b6a4e;
}

/* =================================================== */
@font-face{
  font-family:"Crayon";
  src:url("fonts/HanyiSentyCrayon-non-color.woff2") format("woff2");
  font-display:swap;
}
/* 文字較多的地方用粉筆字，比較好讀
   這個字型檔只含這頁用到的字（約 300KB，載入快）。
   ※ 之後如果改了文字、加了新的字，請 Claude 重新產生這個字型檔，不然新字會顯示成蠟筆字 */
@font-face{
  font-family:"ChalkSub";
  src:url("fonts/HanyiSentyChalk-cards.woff2") format("woff2");
  font-display:swap;
}
.dialog .text,#talkPanel .pk p,.level,#s-result,.box p,.rv .tip,#toast{
  font-family:"ChalkSub","Crayon","PingFang TC","Microsoft JhengHei",sans-serif;
  text-wrap:pretty;line-break:strict}
.level b,#s-result button{font-family:"Crayon","PingFang TC",sans-serif}
#s-result textarea{font-family:"Crayon","PingFang TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,*{touch-action:manipulation}   /* 快速連點不會放大；雙指縮放仍可使用 */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:"Crayon","PingFang TC","Microsoft JhengHei",sans-serif;
  color:var(--ink);
  background:var(--rose) url("images/background1.png") center/cover no-repeat fixed;
  user-select:none;-webkit-user-select:none;
}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
img{-webkit-user-drag:none;user-select:none}

#app{position:fixed;inset:0;height:100dvh}

/* ---------- 畫面切換 ---------- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  padding:calc(70px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom))}
.screen.show{display:flex;animation:fadeIn .6s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ---------- 左上選單、右上音樂 ---------- */
.corner{position:fixed;top:calc(14px + env(safe-area-inset-top));z-index:50;
  width:46px;height:46px;border-radius:50%;background:rgba(247,238,208,.92);
  box-shadow:0 2px 8px rgba(90,74,66,.18);font-size:22px;display:none;align-items:center;justify-content:center}
.corner.show{display:flex}
#menuBtn{left:14px}
#cmenu{position:fixed;z-index:60;top:calc(68px + env(safe-area-inset-top));left:14px;display:none;flex-direction:column;
  background:rgba(250,244,228,.97);border:2px solid var(--pink);border-radius:14px;overflow:hidden;box-shadow:0 4px 12px rgba(90,74,66,.2)}
#cmenu.open{display:flex}
#cmenu button{font-size:19px;padding:10px 22px;text-align:center}
#cmenu button + button{border-top:1px dashed var(--pink)}
#cmenu button:active{background:var(--lilac)}
#musicBtn{right:14px}
#musicBtn.off{opacity:.45;text-decoration:line-through}

/* ---------- 共用按鈕 ---------- */
.btn{padding:12px 26px;border-radius:999px;font-size:clamp(19px,5vw,24px);
  background:var(--blue);color:#fff;box-shadow:0 3px 0 rgba(90,74,66,.18);transition:transform .15s,opacity .2s}
.btn:active{transform:translateY(2px)}
.btn.light{background:var(--cream);color:var(--ink)}
.btn.pink{background:var(--pink);color:var(--ink)}
.btn:disabled{opacity:.4;pointer-events:none}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* ---------- 知更鳥 ---------- */
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

/* ---------- 開場 ---------- */
#s-load{justify-content:center;gap:28px;padding-top:20px}
.cover{position:relative;max-width:86vw;animation:float 3.6s ease-in-out infinite}
.cover img{display:block;height:100%;width:auto;max-width:100%;object-fit:contain}
.cover img.c2{position:absolute;inset:0;margin:auto;opacity:0;animation:glow 2.8s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:0}50%{opacity:1}}
.cover.noimg{aspect-ratio:5/8;background:rgba(120,155,170,.25);border-radius:24px}
.cover.noimg img{display:none}
#cover{height:min(64dvh,680px)}
#coverTalk{height:min(40dvh,440px);flex:0 1 auto;min-height:110px}
#loadText{font-size:clamp(20px,5vw,26px);letter-spacing:.1em;
  background:rgba(247,238,208,.85);padding:8px 22px;border-radius:999px}
#loadText.ready{animation:breathe 2.2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}

/* ---------- 對話 ---------- */
#s-talk{justify-content:center;gap:18px}
.dialog{width:min(100%,620px);background:rgba(250,244,228,.96);color:var(--ink);border-radius:18px;
  border:2px solid var(--pink);padding:16px 20px 12px;box-shadow:0 4px 14px rgba(90,74,66,.2)}
.dialog .text{font-size:clamp(20px,5.2vw,26px);line-height:1.75;letter-spacing:.02em;min-height:1.75em}
.dialog .text ul{list-style:none;margin-top:4px}
.dialog .text li{margin:6px 0;font-size:.9em;line-height:1.45}
.dialog .text b{color:#a85a54;font-weight:normal}
.dialog .nav{display:flex;justify-content:space-between;margin-top:8px}
.dialog .nav button{color:#8a7468;font-size:clamp(16px,4vw,19px);padding:6px 4px}
#talkNext.end{background:#4e7486;color:#fff;padding:8px 20px;border-radius:999px}

/* 三種分類的說明區塊（顏色對應分類按鈕） */
#talkPanel{display:none;flex-direction:column;gap:12px;width:min(100%,620px);flex:0 1 auto;min-height:0;overflow-y:auto}
#s-talk.panel #talkPanel{display:flex}
#s-talk.panel #coverTalk{display:none}
#talkPanel .pk{animation:fadeIn .5s ease both}
#talkPanel .pk:nth-child(2){animation-delay:.25s}
#talkPanel .pk:nth-child(3){animation-delay:.5s}
/* 標題：獨立的色塊標籤，貼在說明框上方 */
#talkPanel .pk h3{display:inline-block;font-weight:normal;font-size:clamp(22px,5.8vw,28px);color:#fff;
  padding:4px 18px 2px;border-radius:12px 12px 0 0;margin-left:12px}
/* 說明：淺色框、深色字 */
#talkPanel .pk p{font-size:clamp(18px,4.6vw,22px);line-height:1.6;color:var(--ink);background:rgba(250,244,228,.97);
  border:2.5px solid;border-radius:14px;padding:10px 16px;box-shadow:0 3px 0 rgba(60,45,40,.18)}
#talkPanel .pk.a h3{background:#a85a54}  #talkPanel .pk.a p{border-color:#a85a54}
#talkPanel .pk.b h3{background:#7a6694}  #talkPanel .pk.b p{border-color:#7a6694}
#talkPanel .pk.c h3{background:#4e7486}  #talkPanel .pk.c p{border-color:#4e7486}

/* ---------- 選主題 ---------- */
#s-theme{justify-content:center;gap:22px}
.title{font-size:clamp(21px,5.4vw,28px);text-align:center;line-height:1.5;
  background:rgba(247,238,208,.88);padding:10px 20px;border-radius:16px}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(100%,420px)}
.themes .btn{width:100%;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.themes .btn[data-t="F"]{background:var(--c-F)}
.themes .btn[data-t="L"]{background:var(--c-L)}
.themes .btn[data-t="P"]{background:var(--c-P)}
.themes .btn[data-t="M"]{background:var(--c-M)}
.themes .btn[data-t="O"]{background:var(--c-O)}
.themes .btn:last-child{grid-column:1/-1}

/* ---------- 卡牌 ---------- */
.card{position:relative;aspect-ratio:804/1642;border-radius:8px;overflow:hidden;
  background:#fff;box-shadow:0 4px 14px rgba(90,74,66,.25);container-type:inline-size}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .ph{display:none}
.card.noimg img{display:none}
.card.noimg .ph{display:flex;position:absolute;inset:0;align-items:center;justify-content:center;
  background:#ddd;color:#888;font-size:18cqw}

/* ---------- 旋轉盤 ---------- */
#s-sort{gap:12px}
.hint{font-size:clamp(17px,4.4vw,21px);background:rgba(247,238,208,.88);padding:6px 16px;border-radius:999px;text-align:center}
.stage{position:relative;flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0}
#ring{--cardH:min(50dvh,480px);--cardW:calc(var(--cardH)*804/1642);
  position:relative;width:100%;height:var(--cardH);perspective:1100px;transform-style:preserve-3d;touch-action:pan-y}
#ring .card{position:absolute;left:50%;top:0;width:var(--cardW);margin-left:calc(var(--cardW)/-2);
  transition:transform .45s ease,opacity .45s ease}
.arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:30;width:42px;height:42px;border-radius:50%;
  background:rgba(247,238,208,.9);font-size:20px;box-shadow:0 2px 6px rgba(90,74,66,.2)}
#prevArrow{left:0}#nextArrow{right:0}
#sortDone{display:none;flex-direction:column;align-items:center;gap:16px}
#sortDone.show{display:flex}
#sortDoneBtn,#levelNext,#scoreOk{background:#4e7486;border:2px solid rgba(255,255,255,.85);box-shadow:0 4px 0 rgba(60,45,40,.28)}
.piles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(100%,560px)}
.pile{position:relative;padding:12px 4px;border-radius:14px;font-size:clamp(19px,5vw,24px);line-height:1.3;
  color:#fff;border:2px solid rgba(255,255,255,.85);box-shadow:0 4px 0 rgba(60,45,40,.28)}
.pile:active{transform:translateY(2px)}
/* 三堆按鈕的顏色 */
.pile.a{background:#a85a54}   /* 可以改變的：紅 */
.pile.b{background:#7a6694}   /* 恆久不變的：紫 */
.pile.c{background:#4e7486}   /* 沒有關聯的：藍 */
.pile .count{position:absolute;top:-8px;right:-4px;min-width:26px;height:26px;border-radius:13px;
  background:var(--cream);color:var(--ink);font-size:15px;line-height:26px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
#sortGuide{font-size:clamp(17px,4.5vw,21px);color:var(--ink);text-align:center;
  background:rgba(247,238,208,.92);padding:6px 16px;border-radius:14px;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.linkbtn{font-size:16px;text-decoration:underline;opacity:.8;padding:4px}
#reviewBtn{font-size:clamp(16px,4.2vw,19px);padding:8px 18px;border-radius:999px;background:var(--cream);
  color:var(--ink);border:2px dashed #a85a54;box-shadow:0 3px 0 rgba(90,74,66,.18)}
#reviewBtn:disabled{opacity:.45}
#reviewBtn.pulse{animation:pulse 1s ease-in-out 3}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.rv .tip{font-size:16px;line-height:1.5;background:#fff;border-radius:12px;padding:8px 12px;margin-bottom:6px;text-align:left}
.rv h3{border-left:6px solid;padding-left:8px}
.rv h3.a{border-color:#a85a54}.rv h3.b{border-color:#7a6694}.rv h3.c{border-color:#4e7486}

/* ---------- 選五張 ---------- */
#s-pick{gap:12px}
.scroll{flex:1;width:100%;overflow-y:auto;min-height:0;padding:6px 2px 10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(100%,640px);margin:0 auto}
.grid .card{transition:transform .2s,box-shadow .2s;cursor:pointer}
.grid .card.sel{transform:scale(.95);box-shadow:0 0 0 4px var(--blue),0 4px 14px rgba(90,74,66,.25)}
.grid .card .mark{display:none;position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;
  background:var(--blue);color:#fff;font-size:18px;line-height:28px;text-align:center}
.grid .card.sel .mark{display:block}

/* ---------- 種子 ---------- */
.seed{display:inline-block;width:30px;height:30px;background:url("images/seed.png") center/contain no-repeat}
body.noseed .seed{background:none}
body.noseed .seed::after{content:"";display:block;width:60%;height:75%;margin:12% auto;border-radius:50%;background:var(--branch)}
.seed.ghost{opacity:.22}
#s-seed{gap:10px}
#seedPool{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:360px}
.seedrow{display:flex;align-items:center;gap:12px;width:min(100%,560px);margin:0 auto 12px;
  background:rgba(247,238,208,.88);border-radius:16px;padding:10px}
.seedrow .card{width:68px;flex:none;cursor:zoom-in}
.seedrow .mid{flex:1;display:flex;flex-wrap:wrap;gap:2px;align-items:center;min-width:0}
.seedrow .ctrl{display:flex;flex-direction:column;align-items:center;gap:4px}
.seedrow .ctrl button{width:42px;height:42px;border-radius:50%;background:var(--blue);color:#fff;font-size:24px;line-height:1}
.seedrow .ctrl button:disabled{opacity:.3}
.seedrow .num{font-size:20px}

/* ---------- 計分 ---------- */
#s-level{gap:12px}
#levelWrap{position:relative;flex:none;height:min(38dvh,420px);aspect-ratio:804/1642;margin-top:4%}
#levelWrap .card{width:100%;height:100%}
#levelNote{position:absolute;left:var(--note-x);top:var(--note-y);width:var(--note-w);
  transform:translateX(-50%) rotate(var(--note-rotate));z-index:2;pointer-events:none;
  filter:drop-shadow(0 3px 4px rgba(90,74,66,.3))}
#levelNote img{display:block;width:100%;height:auto}
#levelNote .ph{display:none;aspect-ratio:4/3;background:#fff6b8;border:2px dashed #c9b25a;
  align-items:center;justify-content:center;font-size:14px;color:#8a7a3a;text-align:center;line-height:1.3}
#levelNote.noimg img{display:none}
#levelNote.noimg .ph{display:flex}
.levels{display:flex;flex-direction:column;gap:10px;width:min(100%,600px)}
.levelBody{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;flex:1;min-height:0;justify-content:center}
.level{text-align:left;padding:10px 16px;border-radius:14px;background:rgba(247,238,208,.94);
  box-shadow:0 3px 0 rgba(90,74,66,.15);font-size:clamp(17px,4.5vw,22px);line-height:1.6}
.level b{display:flex;justify-content:space-between;font-weight:normal;font-size:1.15em;color:var(--blue)}
.level.sel{background:var(--blue);color:#fff}
.level.sel b{color:var(--cream)}

/* ---------- 樹枝計分 ---------- */
#s-score{justify-content:center;gap:30px}
.branch{position:relative;width:min(92%,640px);height:120px}
.branch .bar{position:absolute;left:0;right:0;top:60px;height:14px;border-radius:7px;
  background:linear-gradient(180deg,#a5805f,var(--branch) 60%,#6f523b)}
.branch .leaf{position:absolute;width:22px;height:12px;border-radius:0 100% 0 100%;background:#9bb08a}
.branch .tick{position:absolute;top:80px;transform:translateX(-50%);font-size:15px}
.branch .tick::before{content:"";position:absolute;left:50%;top:-8px;width:2px;height:6px;background:var(--branch)}
#marker{position:absolute;top:24px;left:0;width:38px;height:38px;margin-left:-19px;transition:left .8s ease}
#marker .seed{width:38px;height:38px}
#plus{position:absolute;top:-6px;transform:translateX(-50%);font-size:26px;color:var(--blue);opacity:0}
#plus.pop{animation:pop 1s ease}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
#scoreText{min-height:2em;font-size:clamp(22px,5.8vw,30px)}
#scoreText .big{font-size:clamp(48px,13vw,72px);color:#4e7486;margin:0 .12em;line-height:1;vertical-align:-.12em}

/* ---------- 結果 ---------- */
#s-result{justify-content:flex-start;gap:18px;overflow-y:auto}
#s-result > *{flex:none}
.result{width:min(100%,640px);background:rgba(250,244,228,.97);border-radius:20px;padding:22px 22px 20px;
  box-shadow:0 6px 18px rgba(90,74,66,.2);border:2px solid var(--pink);text-align:left}
.result .score{font-size:clamp(20px,5.2vw,25px);color:var(--ink)}
.result h2{font-weight:normal;font-size:clamp(18px,4.6vw,22px);color:#4e7486;margin:4px 0 12px}
.result p{font-size:clamp(18px,4.6vw,22px);line-height:1.75}
.res-top{display:flex;gap:16px;align-items:center}
.res-top .card{width:92px;flex:none;cursor:zoom-in}
.res-top .nm{font-size:clamp(24px,6.4vw,32px);color:var(--ink);line-height:1.3;word-break:break-all}
.res-top .sk{font-size:clamp(17px,4.4vw,20px);margin-top:4px;color:#4e7486}
.res-top .lv{display:inline-block;margin-top:8px;font-size:clamp(15px,3.9vw,17px);color:#4e7486;
  border:1.5px solid #4e7486;border-radius:999px;padding:1px 12px}
.res-sec{margin-top:16px;padding-top:14px;border-top:1.5px dashed var(--pink)}
.res-sec h3{font-weight:normal;font-size:clamp(18px,4.6vw,21px);color:#4e7486;margin-bottom:4px}
.res-note{margin-top:16px;padding-top:14px;border-top:1.5px dashed var(--pink);font-size:clamp(16px,4.2vw,19px)!important}
.res-gift{margin-top:10px;color:#a85a54}
.res-shop{margin-top:16px;padding-top:14px;border-top:1.5px dashed var(--pink);text-align:center}
.res-shop p{font-size:clamp(16px,4.2vw,19px)!important;margin-bottom:10px}
.panel2{width:min(100%,640px);background:rgba(250,244,228,.97);border-radius:20px;padding:20px 20px;
  border:2px solid var(--pink);box-shadow:0 4px 14px rgba(90,74,66,.16);text-align:center}
.panel2 .part + .part{margin-top:18px;padding-top:16px;border-top:1.5px dashed var(--pink)}
.panel2 h2{font-weight:normal;font-size:clamp(22px,5.6vw,28px);color:#4e7486;margin-bottom:4px}
.panel2 .sub{font-size:clamp(16px,4.2vw,18px);margin-bottom:12px;line-height:1.6;color:var(--ink)}
.panel2 .q{font-size:clamp(17px,4.4vw,20px);margin-bottom:6px;color:var(--ink)}
.rate{display:flex;justify-content:center;gap:6px;margin-bottom:12px}
.rate button{font-size:32px;filter:grayscale(1);opacity:.4;transition:transform .15s}
.rate button.on{filter:none;opacity:1;transform:scale(1.1)}
/* 自己畫的花：亮 / 不亮兩張圖 */
.rate.img button{filter:none;opacity:1;width:48px;height:48px;position:relative}
.rate.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.rate.img img.on{opacity:0}
.rate.img button.on img.on{opacity:1}
.rate.img button.on img.off{opacity:0}
#fbHp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
#fbText{width:100%;min-height:96px;font-family:inherit;font-size:18px;padding:10px 12px;border-radius:12px;
  border:2px solid var(--pink);background:#fff;color:var(--ink);resize:vertical;margin-bottom:10px}
#fbMsg{min-height:1.5em;font-size:16px;margin-top:8px;color:#a85a54}
#fbSend{background:#4e7486}
#spQR{display:none;width:min(60%,220px);margin:8px auto 12px;border-radius:12px;background:#fff;padding:8px}
#spQR.show{display:block}
#spBtn{background:#c78696}
.endrow{margin-bottom:10px}

/* ---------- 彈出視窗 ---------- */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
  background:rgba(90,74,66,.45);padding:20px}
.modal.show{display:flex;animation:fadeIn .3s}
.box{width:min(100%,460px);max-height:86dvh;overflow-y:auto;background:var(--cream);border-radius:20px;
  padding:22px 20px;text-align:center;font-size:clamp(18px,4.6vw,22px);line-height:1.6}
.box p{margin-bottom:16px}
.box input{width:100%;font-family:inherit;font-size:20px;padding:10px 14px;border-radius:12px;
  border:2px solid var(--pink);background:#fff;color:var(--ink);margin-bottom:6px}
.box .err{color:#b0605a;font-size:16px;min-height:1.4em;margin-bottom:10px}
#zoomModal .card{height:min(78dvh,620px);margin:auto}

    <div id="talkPanel"></div>
    <div class="dialog" id="talkBox">
      <div class="text" id="talkText"></div>
      <div class="nav"><button id="talkPrev">◂ 上一句</button><button id="talkNext">下一句 ▸</button></div>
    </div>
  </section>

  <!-- 選主題 -->
  <section class="screen" id="s-theme">
    <p class="title" id="themeTitle"></p>
    <div class="themes" id="themeBtns"></div>
  </section>

    <p class="hint" id="sortHint"></p>
    <div class="stage">
      <div id="ring"></div>
      <button class="arrow" id="prevArrow" aria-label="上一張">◂</button>
      <button class="arrow" id="nextArrow" aria-label="下一張">▸</button>
      <div id="sortDone"><p class="title">全部分類完成！</p><button class="btn" id="sortDoneBtn">完成分類</button></div>
    </div>
    <p id="sortGuide"></p>
    <div class="piles">

    <button id="reviewBtn"></button>

    <div id="seedPool"></div>
    <div class="scroll" id="seedList"></div>
    <button class="btn" id="seedOk">分配好了</button>
  </section>

    <p class="hint" id="levelHint"></p>
    <div class="levelBody">
      <div id="levelWrap">
        <div class="card" id="levelCard"></div>
        <div id="levelNote"><img alt=""><div class="ph"></div></div>
      </div>
      <div class="levels" id="levelBtns"></div>
    </div>
    <div class="row levelNav">
      <button class="btn light" id="levelPrev">◂ 上一張</button>
      <button class="btn" id="levelNext">下一張 ▸</button>
    </div>
  </section>

  <!-- 樹枝計分動畫 -->
  <section class="screen" id="s-score">
    <p class="title" id="scoreTitle"></p>
    <div class="branch" id="branch">
      <div class="bar"></div>
      <span id="plus"></span>
      <div id="marker"><span class="seed"></span></div>
    </div>
    <p class="title" id="scoreText" style="visibility:hidden"></p>
    <button class="btn" id="scoreOk" style="visibility:hidden">看看結果</button>
  </section>

  <!-- 結果 -->
  <section class="screen" id="s-result">
    <div class="result" id="resBox">
      <p class="score" id="resScore"></p>
      <h2 id="resTopTitle"></h2>
      <div class="res-top">
        <div id="resCard"></div>
        <div><div class="nm" id="resName"></div><div class="sk" id="resSkill"></div><span class="lv" id="resLevel"></span></div>
      </div>
      <div class="res-sec"><h3 id="resStateT"></h3><p id="resState"></p></div>
      <div class="res-sec tip"><h3 id="resTipT"></h3><p id="resTip"></p></div>
      <p class="res-note" id="resNote"></p>
      <p class="res-gift" id="resGift"></p>
      <div class="res-shop" id="resShop"><p id="shopText"></p><button class="btn" id="shopBtn"></button></div>
    </div>

        <h2 id="fbTitle"></h2>
        <p class="sub" id="fbSub"></p>
        <p class="q" id="fbRate"></p>
        <div class="rate" id="rate"></div>

        <button class="btn" id="fbSend"></button>
        <p id="fbMsg"></p>
      </div>
      <div class="part" id="spBox">
        <h2 id="spTitle"></h2>
        <p class="sub" id="spText"></p>
        <img id="spQR" alt="贊助 QR code">
        <button class="btn" id="spBtn"></button>
      </div>
    </div>

    <div class="row endrow">
      <button class="btn pink" id="again">重新來一次</button>
      <button class="btn light" id="toHome">回到首頁</button>
    </div>
  </section>
</div>

  <p id="leaveText"></p>
  <div class="row"><button class="btn light" id="leaveNo">繼續排卡</button><button class="btn" id="leaveYes">離開</button></div>
</div></div>

<div class="modal" id="zeroModal"><div class="box">
  <p id="zeroText"></p>
  <div class="row"><button class="btn" id="zeroBack">回去重新分類</button></div>
</div></div>

const $ = s => document.querySelector(s);
const fill = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k]);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const failed = new Set();

/* ---------- 主題（從故事頁帶入：cards.html?theme=F） ---------- */
(function readTheme(){
  const map = {F:'F',friendship:'F',friend:'F','友情':'F', L:'L',love:'L','愛情':'L',
    P:'P',plan:'P','未來規劃':'P', M:'M',money:'M','財務管理':'M', O:'O',other:'O','其他':'O'};
  const p = new URLSearchParams(location.search).get('theme');
  if (p && map[p] !== undefined) theme = map[p];
  else if (p && map[p.toUpperCase()]) theme = map[p.toUpperCase()];
})();

/* ---------- 畫面 ---------- */
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('show'));
  $('#' + id).classList.add('show');
}
let toastT;
function toast(msg){
  const t = $('#toast'); t.innerHTML = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), Math.max(2200, msg.length * 110));
}
const openM  = id => $('#' + id).classList.add('show');
const closeM = id => $('#' + id).classList.remove('show');

/* ---------- 卡片元素 ---------- */
function cardEl(code, opt = {}){
  const d = document.createElement('div');
  d.className = 'card'; d.dataset.code = code;
  const img = document.createElement('img');
  img.alt = code; img.decoding = 'async'; img.src = CARD + code + '.webp';
  if (failed.has(CARD + code + '.webp')) img.src = CARD + code + '.png';
  img.onerror = () => {             // webp 讀不到時改用 png，再不行就顯示編號
    if (img.src.endsWith('.webp')) img.src = CARD + code + '.png'; else d.classList.add('noimg'); };
  const ph = document.createElement('div'); ph.className = 'ph'; ph.textContent = code;
  d.append(img, ph);
  return d;
}

function zoom(code){
  const b = $('#zoomBody'); b.innerHTML = ''; b.appendChild(cardEl(code)); openM('zoomModal');
}
$('#zoomModal').onclick = () => closeM('zoomModal');


/* ---------- 知更鳥 ---------- */
function setupCover(el){
  const [a, b] = el.querySelectorAll('img');
  if (failed.has(FILES.cover1)){ el.classList.add('noimg'); return; }
  a.src = FILES.cover1;
  if (failed.has(FILES.cover2)) b.remove(); else b.src = FILES.cover2;
}

/* ---------- 預先載入 ---------- */
function loadImg(src, ms = 12000){
  return new Promise(res => {
    const i = new Image(); let done = false;
    const end = ok => { if (done) return; done = true; if (!ok) failed.add(src); res(); };
    i.onload = () => end(true); i.onerror = () => end(false);
    setTimeout(() => end(i.complete && i.naturalWidth > 0), ms);
    i.src = src;
  });
}
async function preload(){
  // 1. 先載開場知更鳥
  await Promise.all([FILES.cover1, FILES.cover2].map(f => loadImg(f, 6000)));
  setupCover($('#cover')); setupCover($('#coverTalk'));

  // 音樂不用等，邊播邊下載
  music = new Audio(FILES.music); music.loop = true; music.volume = .6; music.preload = 'auto';

  // 2. 開始前一定要有的：背景、種子、字型
  const must = [FILES.bg, FILES.seed];
  let n = 0; const total = must.length + 1;
  const step = () => { n++; $('#loadText').textContent = TEXT.loading + ' ' + Math.round(n / total * 100) + '%'; };
  const font = Promise.race([document.fonts ? Promise.all([document.fonts.load('20px Crayon'), document.fonts.load('20px ChalkSub')]) : 0, sleep(10000)]).catch(()=>{}).then(step);
  await Promise.all([...must.map(s => loadImg(s).then(step)), font]);
  if (failed.has(FILES.seed)) document.body.classList.add('noseed');

  // 3. 卡牌和其他圖片在背景慢慢載，不用等（這次主題的卡排最前面）
  const first = [...COMMON, ...(theme ? THEMES[theme].cards : [])];
  const rest = Object.values(THEMES).flatMap(t => t.cards).filter(c => !first.includes(c));
  const later = [...[...first, ...rest].map(c => CARD + c + '.webp'), FILES.flowerOn, FILES.flowerOff,
    ...[...first, ...rest].map(c => NOTE + c + '.png'), FILES.sponsorQR];
  (async () => { for (let i = 0; i < later.length; i += 4) await Promise.all(later.slice(i, i + 4).map(s => loadImg(s, 20000))); })();

  const lt = $('#loadText'); lt.textContent = TEXT.ready; lt.classList.add('ready');
  $('#s-load').addEventListener('click', start, {once:true});
}

/* ---------- 對話 ---------- */
let typing = null;
function talk(lines, endLabel, onDone){
  show('s-talk');
  const txt = $('#talkText'), prev = $('#talkPrev'), next = $('#talkNext');
  let i = 0;
  const finish = () => { if (typing){ clearInterval(typing.t); txt.innerHTML = typing.full; typing = null; } };
  const render = () => {
    finish();
    let line = lines[i];
    const panel = typeof line === 'object' && line.panel;
    if (typeof line === 'object') line = line.text;
    $('#s-talk').classList.toggle('panel', !!panel);
    if (panel) $('#talkPanel').innerHTML = TEXT.piles.map((p, k) =>
      `<div class="pk ${'abc'[k]}"><h3>${p.title}</h3><p>${p.desc}</p></div>`).join('');
    prev.style.visibility = i ? 'visible' : 'hidden';
    const last = i === lines.length - 1;
    next.textContent = last ? endLabel : '下一句 ▸';
    next.classList.toggle('end', last);
    if (line.includes('<')){ txt.innerHTML = line; return; }
    txt.textContent = ''; let k = 0;
    typing = { full: line, t: setInterval(() => {
      txt.textContent = line.slice(0, ++k);
      if (k >= line.length) finish();
    }, 45) };
  };
  prev.onclick = () => { if (i > 0){ i--; render(); } };
  next.onclick = () => {
    if (typing){ finish(); return; }
    if (i < lines.length - 1){ i++; render(); } else { onDone(); }
  };
  $('#talkText').onclick = () => finish();
  render();
}

/* ---------- 開始 ---------- */
function start(){
  guard = true;
  if (music) music.play().catch(()=>{});
  if (music) $('#musicBtn').classList.add('show');
  $('#menuBtn').classList.add('show');
  talk(TEXT.prep, TEXT.prepEnd, () => theme ? sortIntro() : chooseTheme());
}

function chooseTheme(){
  $('#themeTitle').innerHTML = TEXT.themeTitle;
  const box = $('#themeBtns'); box.innerHTML = '';
  Object.entries(THEMES).forEach(([k, v], idx) => {
    const b = document.createElement('button');
    b.className = 'btn'; b.dataset.t = k; b.textContent = v.name;
    b.onclick = () => { theme = k; sortIntro(); };
    box.appendChild(b);
  });
  show('s-theme');
}

function sortIntro(){ talk(TEXT.sortIntro, TEXT.sortIntroEnd, startSort); }

/* ---------- 旋轉盤 ---------- */
let cur = 0, ringEls = {};
const deck = () => cards.filter(c => !c.pile);

function startSort(){
  cards = [...THEMES[theme].cards, ...COMMON].map(code => ({code, pile:null, seeds:0, level:0}));
  const ring = $('#ring'); ring.innerHTML = ''; ringEls = {};
  cards.forEach(c => {
    const el = cardEl(c.code, {hint:true});
    el.onclick = () => onCardTap(c);
    ring.appendChild(el); ringEls[c.code] = el;
  });
  cur = 0; show('s-sort'); renderRing();
}

function renderRing(){
  const d = deck(), n = d.length;
  const ring = $('#ring');
  ring.style.display = n === 0 ? 'none' : '';
  const w = ring.querySelector('.card') ? ring.querySelector('.card').offsetWidth : 150;
  const wide = innerWidth >= 700 && innerWidth > innerHeight;
  const gap = w * (wide ? .78 : .58);
  if (cur >= n) cur = 0;
  cards.forEach(c => { if (c.pile){ const e = ringEls[c.code]; e.style.opacity = 0; e.style.pointerEvents = 'none'; e.style.zIndex = 0; } });
  d.forEach((c, i) => {
    let off = i - cur;
    if (n > 2){ if (off > n / 2) off -= n; if (off < -n / 2) off += n; }
    const a = Math.abs(off), e = ringEls[c.code];
    const vis = a <= (wide ? 3 : 2);
    e.style.transform = `translateX(${off * gap}px) translateZ(${-a * 110}px) rotateY(${-off * 26}deg)`;
    e.style.opacity = vis ? (1 - a * .22) : 0;
    e.style.zIndex = 20 - a;
    e.style.pointerEvents = vis ? 'auto' : 'none';
  });
  $('#sortHint').textContent = fill(TEXT.sortHint, {n});
  $('#sortGuide').textContent = TEXT.sortGuide;
  $('#reviewBtn').textContent = TEXT.reviewBtn;
  $('#reviewBtn').disabled = cards.every(c => !c.pile);
  $('#sortGuide').style.visibility = n ? 'visible' : 'hidden';
  const done = n === 0;
  $('#sortDone').classList.toggle('show', done);
  $('#prevArrow').style.display = $('#nextArrow').style.display = n > 1 ? '' : 'none';
  document.querySelectorAll('.pile').forEach(b => {
    b.querySelector('.count').textContent = cards.filter(c => c.pile === b.dataset.p).length;
    b.disabled = done;
  });
}
function turn(dir){ const n = deck().length; if (n){ cur = (cur + dir + n) % n; renderRing(); } }
$('#prevArrow').onclick = () => turn(-1);
$('#nextArrow').onclick = () => turn(1);

(function swipe(){
  const ring = $('#ring'); let x0 = null, moved = false;
  ring.addEventListener('pointerdown', e => { x0 = e.clientX; moved = false; });
  ring.addEventListener('pointermove', e => { if (x0 !== null && Math.abs(e.clientX - x0) > 12) moved = true; });
  ring.addEventListener('pointerup', e => {
    if (x0 === null) return;
    const dx = e.clientX - x0; x0 = null;
    if (Math.abs(dx) > 40) turn(dx < 0 ? 1 : -1);
  });
  ring.addEventListener('click', e => { if (moved){ e.stopPropagation(); moved = false; } }, true);
})();

function onCardTap(c){
  const d = deck(), i = d.indexOf(c);
  if (i < 0) return;
  if (i !== cur){ cur = i; renderRing(); return; }
  zoom(c.code);
}

function classify(p){
  const d = deck(); if (!d.length) return;
  const c = d[cur];
  const e = ringEls[c.code];
  const dx = {a:-1, b:0, c:1}[p] * innerWidth * .3;
  e.style.transform = `translate(${dx}px, ${innerHeight * .45}px) scale(.2)`;
  e.style.opacity = 0;
  c.pile = p;
  setTimeout(renderRing, 280);
  // 第一次分類後，提醒可以查看與放回
  if (!tipShown){ tipShown = true; setTimeout(() => { toast(TEXT.reviewTip);
    const r = $('#reviewBtn'); r.classList.remove('pulse'); void r.offsetWidth; r.classList.add('pulse'); }, 450); }
}
let tipShown = false;
document.querySelectorAll('.pile').forEach(b => b.onclick = () => classify(b.dataset.p));


/* 查看已分類 */
const PILE_NAME = {a:'可以改變的', b:'恆久不變的', c:'沒有關聯的'};
function openReview(){
  const body = $('#reviewBody'); body.innerHTML = '<p class="tip">' + TEXT.reviewHint + '</p>';
  ['a','b','c'].forEach(p => {
    const h = document.createElement('h3'); h.className = p; h.textContent = PILE_NAME[p]; body.appendChild(h);
    const list = document.createElement('div'); list.className = 'list';
    const items = cards.filter(c => c.pile === p);
    if (!items.length){ list.innerHTML = '<span class="empty">（還沒有卡）</span>'; }
    items.forEach(c => {
      const it = document.createElement('div'); it.className = 'item';
      const ce = cardEl(c.code); ce.onclick = () => zoom(c.code);
      const b = document.createElement('button'); b.textContent = '放回轉盤';
      b.onclick = () => { c.pile = null; cur = deck().indexOf(c); renderRing(); openReview(); };
      it.append(ce, b); list.appendChild(it);
    });
    body.appendChild(list);
  });
  openM('reviewModal');
}
$('#reviewBtn').onclick = openReview;
$('#reviewClose').onclick = () => closeM('reviewModal');

/* 完成分類 */
$('#sortDoneBtn').onclick = afterSort;
function afterSort(){
  const a = cards.filter(c => c.pile === 'a');
  if (a.length === 0){ $('#zeroText').innerHTML = TEXT.zero; openM('zeroModal'); return; }
  if (a.length > MAX_CHANGE){ startPick(); return; }
  talk(TEXT.seedIntro, TEXT.seedIntroEnd, startSeeds);
}
$('#zeroBack').onclick = () => {
  closeM('zeroModal');
  cards.forEach(c => c.pile = null); cur = 0; show('s-sort'); renderRing();
};

/* ---------- 選出五張 ---------- */
let picked = new Set();
function startPick(){
  picked = new Set();
  $('#pickTitle').innerHTML = fill(TEXT.pickTitle, {max:MAX_CHANGE});
  const g = $('#pickGrid'); g.innerHTML = '';
  cards.filter(c => c.pile === 'a').forEach(c => {
    const el = cardEl(c.code);
    const m = document.createElement('span'); m.className = 'mark'; m.textContent = '✓'; el.appendChild(m);
    el.onclick = () => {
      if (picked.has(c)){ picked.delete(c); el.classList.remove('sel'); }
      else if (picked.size >= MAX_CHANGE){ toast(fill(TEXT.pickFull, {max:MAX_CHANGE})); return; }
      else { picked.add(c); el.classList.add('sel'); }
      updPick();
    };
    g.appendChild(el);
  });
  updPick(); show('s-pick');
}
function updPick(){
  const b = $('#pickOk');
  b.textContent = '確定（' + fill(TEXT.pickCount, {n:picked.size, max:MAX_CHANGE}) + '）';
  b.disabled = picked.size !== MAX_CHANGE;
}
$('#pickOk').onclick = () => {
  cards.forEach(c => { if (c.pile === 'a' && !picked.has(c)) c.pile = 'b'; });
  talk(TEXT.seedIntro, TEXT.seedIntroEnd, startSeeds);
};

/* ---------- 分配種子 ---------- */
const chosen = () => cards.filter(c => c.pile === 'a');
const seedIcon = ghost => { const s = document.createElement('span'); s.className = 'seed' + (ghost ? ' ghost' : ''); return s; };
function startSeeds(){
  chosen().forEach(c => c.seeds = 1);
  renderSeeds(); show('s-seed');
}
function renderSeeds(){
  const list = chosen(), used = list.reduce((s, c) => s + c.seeds, 0), left = TOTAL_SEEDS - used;
  $('#seedLeft').textContent = fill(TEXT.seedLeft, {n:left});
  const pool = $('#seedPool'); pool.innerHTML = '';
  for (let i = 0; i < TOTAL_SEEDS; i++) pool.appendChild(seedIcon(i >= left));
  const box = $('#seedList'); box.innerHTML = '';
  list.forEach(c => {
    const row = document.createElement('div'); row.className = 'seedrow';
    const ce = cardEl(c.code); ce.onclick = () => zoom(c.code);
    const mid = document.createElement('div'); mid.className = 'mid';
    for (let i = 0; i < c.seeds; i++) mid.appendChild(seedIcon());
    const ctrl = document.createElement('div'); ctrl.className = 'ctrl';
    const plus = document.createElement('button'); plus.textContent = '+'; plus.disabled = left === 0;
    const num = document.createElement('span'); num.className = 'num'; num.textContent = c.seeds;
    const minus = document.createElement('button'); minus.textContent = '−'; minus.disabled = c.seeds <= 1;
    plus.onclick = () => { c.seeds++; renderSeeds(); };
    minus.onclick = () => { c.seeds--; renderSeeds(); };
    ctrl.append(plus, num, minus);
    row.append(ce, mid, ctrl); box.appendChild(row);
  });
  $('#seedOk').disabled = left !== 0;
}
$('#seedOk').onclick = () => talk(TEXT.levelIntro, TEXT.levelIntroEnd, () => { lvIdx = 0; renderLevel(); show('s-level'); });

/* ---------- 計分 ---------- */
let lvIdx = 0;
const points = c => c.level === 3 ? c.seeds : c.level === 2 ? c.seeds / 2 : 0;
function renderLevel(){
  const list = chosen(), c = list[lvIdx];
  $('#levelHint').textContent = fill(TEXT.levelHint, {i:lvIdx + 1, total:list.length, s:c.seeds});
  const old = $('#levelCard'), el = cardEl(c.code); el.id = 'levelCard';
  el.onclick = () => zoom(c.code); old.replaceWith(el);
  const note = $('#levelNote'), nimg = note.querySelector('img'), nsrc = NOTE + c.code + '.png';
  note.querySelector('.ph').innerHTML = '能力便條紙<br>' + c.code;
  note.classList.toggle('noimg', failed.has(nsrc));
  nimg.onerror = () => note.classList.add('noimg');
  nimg.src = nsrc;
  const box = $('#levelBtns'); box.innerHTML = '';
  TEXT.levels.forEach((lv, k) => {
    const pts = k === 2 ? c.seeds : k === 1 ? c.seeds / 2 : 0;
    const b = document.createElement('button');
    b.className = 'level' + (c.level === k + 1 ? ' sel' : '');
    b.innerHTML = `<b><span>${lv.title}</span><span>+${pts}</span></b>${lv.desc}`;
    b.onclick = () => {
      c.level = k + 1; renderLevel();
      // 不是最後一張：選完自動到下一張；最後一張：等使用者按「確認完成」
      if (lvIdx < list.length - 1){
        const at = lvIdx;
        setTimeout(() => { if (lvIdx === at){ lvIdx++; renderLevel(); } }, 400);
      }
    };
    box.appendChild(b);
  });
  const last = lvIdx === list.length - 1, next = $('#levelNext');
  $('#levelPrev').style.visibility = lvIdx ? 'visible' : 'hidden';
  next.textContent = last ? TEXT.levelDone : '下一張 ▸';
  next.disabled = last ? !list.every(x => x.level) : !c.level;
}
$('#levelPrev').onclick = () => { if (lvIdx > 0){ lvIdx--; renderLevel(); } };
$('#levelNext').onclick = () => {
  const list = chosen();
  if (lvIdx < list.length - 1){ lvIdx++; renderLevel(); } else startScore();
};

/* ---------- 樹枝計分動畫 ---------- */
function buildBranch(){
  const br = $('#branch');
  br.querySelectorAll('.tick,.leaf').forEach(e => e.remove());
  for (let i = 0; i <= 10; i++){
    const t = document.createElement('span'); t.className = 'tick'; t.textContent = i;
    t.style.left = (i * 10) + '%'; br.appendChild(t);
  }
  [[8,46,-20],[27,76,160],[46,46,-30],[63,76,150],[84,46,-15]].forEach(([x, y, r]) => {
    const l = document.createElement('span'); l.className = 'leaf';
    l.style.left = x + '%'; l.style.top = y + 'px'; l.style.transform = `rotate(${r}deg)`; br.appendChild(l);
  });
}
async function startScore(){
  buildBranch();
  $('#scoreTitle').textContent = TEXT.scoreTitle;
  $('#scoreText').style.visibility = $('#scoreOk').style.visibility = 'hidden';
  const marker = $('#marker'), plus = $('#plus');
  marker.style.left = '0%';
  show('s-score');
  await sleep(900);
  let total = 0;
  for (const c of chosen()){
    const p = points(c); total += p;
    marker.style.left = (total * 10) + '%';
    plus.textContent = '+' + p; plus.style.left = (total * 10) + '%';
    plus.classList.remove('pop'); void plus.offsetWidth; plus.classList.add('pop');
    await sleep(1000);
  }
  $('#scoreText').innerHTML = fill(TEXT.scoreFinal, {n:'<span class="big">' + total + '</span>'});
  $('#scoreText').style.visibility = $('#scoreOk').style.visibility = 'visible';
  $('#scoreOk').onclick = () => showResult();
}

/* ---------- 結果 ---------- */
let lastResult = null, fbRating = 0, fbSent = false, useFlowerImg = false;
// 找出種子最多的卡；同樣多時取 Level 最高的；還是一樣就隨機選一張
function pickTop(){
  const list = chosen();
  const maxS = Math.max(...list.map(c => c.seeds));
  let cand = list.filter(c => c.seeds === maxS);
  const maxL = Math.max(...cand.map(c => c.level));
  cand = cand.filter(c => c.level === maxL);
  return cand[Math.floor(Math.random() * cand.length)];
}
function showResult(){
  const total = chosen().reduce((s, c) => s + points(c), 0);
  const top = pickTop(), f = FACTORS[top.code], lv = Math.max(1, top.level) - 1;
  $('#resScore').textContent = fill(TEXT.scoreFinal, {n:total});
  $('#resTopTitle').textContent = TEXT.resTop;
  const ce = cardEl(top.code); ce.onclick = () => zoom(top.code);
  $('#resCard').replaceChildren(ce);
  $('#resName').textContent = f.name;
  $('#resSkill').textContent = fill(TEXT.resSkill, {s:f.skill});
  $('#resLevel').textContent = fill(TEXT.resLevel, {l:TEXT.levels[lv].title});
  $('#resStateT').textContent = TEXT.resState; $('#resState').textContent = f.state[lv];
  $('#resTipT').textContent = TEXT.resTip;     $('#resTip').textContent = f.tip[lv];
  $('#resNote').textContent = TEXT.resNote;
  $('#resGift').textContent = TEXT.resGift;
  $('#shopText').innerHTML = TEXT.shopText;
  $('#shopBtn').textContent = FILES.shop ? TEXT.shopBtn : TEXT.soon; $('#shopBtn').disabled = !FILES.shop;
  lastResult = { theme: THEMES[theme] ? THEMES[theme].name : '', score: total,
    card: top.code, factor: f.name, level: lv + 1 };
  setupFeedback(); setupSponsor();
  show('s-result'); $('#s-result').scrollTop = 0;
}
$('#shopBtn').onclick = () => window.open(FILES.shop, '_blank');

/* 回饋 */
function setupFeedback(){
  fbRating = 0; fbSent = false;
  useFlowerImg = !failed.has(FILES.flowerOn) && !failed.has(FILES.flowerOff);
  $('#rate').classList.toggle('img', useFlowerImg);
  $('#fbTitle').textContent = TEXT.fbTitle; $('#fbSub').textContent = TEXT.fbSub;
  $('#fbRate').textContent = TEXT.fbRate; $('#fbText').placeholder = TEXT.fbPlace; $('#fbText').value = '';
  $('#fbSend').textContent = TEXT.fbSend; $('#fbSend').disabled = false; $('#fbMsg').textContent = '';
  const r = $('#rate'); r.innerHTML = '';
  for (let i = 1; i <= 5; i++){
    const b = document.createElement('button'); b.setAttribute('aria-label', i + ' 朵花');
    if (useFlowerImg) b.innerHTML = `<img class="off" src="${FILES.flowerOff}" alt=""><img class="on" src="${FILES.flowerOn}" alt="">`;
    else b.textContent = '🌸';
    b.onclick = () => { fbRating = i; [...r.children].forEach((x, k) => x.classList.toggle('on', k < i)); };
    r.appendChild(b);
  }
}
$('#fbSend').onclick = async () => {
  if (fbSent) return;
  const msg = $('#fbText').value.trim(), out = $('#fbMsg');
  if (!fbRating && !msg){ out.textContent = TEXT.fbNeed; return; }
  if (!FILES.feedback){ out.textContent = TEXT.fbOff; return; }
  // 同一台裝置 60 秒內只能送一次，避免連續狂按
  let lastAt = 0; try { lastAt = +localStorage.getItem('fbLast') || 0; } catch(e){}
  if (Date.now() - lastAt < 60000){ out.textContent = TEXT.fbWait; return; }
  $('#fbSend').disabled = true; out.textContent = TEXT.fbSending;
  const data = Object.assign({ rating: fbRating, message: msg, hp: $('#fbHp').value,
    device: innerWidth < 700 ? '手機' : '電腦/平板' }, lastResult);
  try {
    const ctrl = new AbortController(), tm = setTimeout(() => ctrl.abort(), 12000);
    await fetch(FILES.feedback, { method:'POST', mode:'no-cors', signal: ctrl.signal,
      headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(data) });
    clearTimeout(tm);
    fbSent = true; out.textContent = TEXT.fbOk;
    try { localStorage.setItem('fbLast', Date.now()); } catch(e){}
  } catch(e){
    out.textContent = TEXT.fbFail; $('#fbSend').disabled = false;
  }
};

/* 贊助 */
function setupSponsor(){
  const hasQR = !failed.has(FILES.sponsorQR);
  $('#spTitle').textContent = TEXT.spTitle; $('#spText').textContent = TEXT.spText;
  $('#spBtn').textContent = FILES.sponsor ? TEXT.spBtn : TEXT.soon; $('#spBtn').disabled = !FILES.sponsor;
  $('#spBtn').style.display = (!FILES.sponsor && hasQR) ? 'none' : '';
  const q = $('#spQR'); q.classList.toggle('show', hasQR); if (hasQR) q.src = FILES.sponsorQR;
}
$('#spBtn').onclick = () => window.open(FILES.sponsor, '_blank');

$('#toHome').onclick = () => go(FILES.home);
$('#again').onclick = () => {          // 重新來一次：清空這次的卡牌、種子與自定義文字，回到選主題
  cards = []; theme = null; lvIdx = 0; cur = 0; tipShown = false;
  chooseTheme();
};

/* =========================================================
   🛠 工作人員檢查點
   開啟／關閉：點左上角選單 →「工作人員」→ 輸入 4 位數密碼
   ========================================================= */
const STAFF_CODE = '0806';   // ✏️ 工作人員密碼（只能是 4 位數字）
function setupStaff(menuEl, groups, btnPos, panelPos, onOpen){
  const KEY = 'staffMode';
  const get = () => { try { return sessionStorage.getItem(KEY) === '1'; } catch(e){ return false; } };
  const set = v => { try { v ? sessionStorage.setItem(KEY, '1') : sessionStorage.removeItem(KEY); } catch(e){} };
  const css = document.createElement('style');
  css.textContent = `
  #stf-btn{position:fixed;${btnPos};z-index:400;width:44px;height:44px;border-radius:50%;border:none;
    background:#333;color:#fff;font-size:20px;opacity:.8;display:none;cursor:pointer}
  #stf-btn.on{display:block}
  #stf-panel{position:fixed;${panelPos};z-index:400;display:none;
    max-width:min(340px,92vw);max-height:70dvh;overflow:auto;background:rgba(30,30,30,.92);color:#fff;
    border-radius:12px;padding:10px;font:14px/1.4 sans-serif}
  #stf-panel.open{display:block}
  #stf-panel .g{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:8px}
  #stf-panel b{font-weight:normal;color:#f3c7bd;width:100%}
  #stf-panel button{border:none;border-radius:6px;padding:5px 9px;background:#555;color:#fff;font-size:14px;cursor:pointer}
  #stf-lock{position:fixed;inset:0;z-index:500;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}
  #stf-lock.open{display:flex}
  #stf-lock .bx{background:#fff;border-radius:14px;padding:18px;width:min(280px,86vw);text-align:center;font:16px/1.5 sans-serif;color:#333}
  #stf-lock input{width:100%;font-size:26px;letter-spacing:.5em;text-align:center;padding:6px;margin:10px 0 4px;border:2px solid #ccc;border-radius:10px}
  #stf-lock .msg{min-height:1.4em;font-size:14px;color:#b0605a}
  #stf-lock button{margin-top:8px;border:none;border-radius:999px;padding:6px 18px;background:#eee;font-size:15px;cursor:pointer}`;
  document.head.appendChild(css);

  const btn = document.createElement('button'); btn.id = 'stf-btn'; btn.type = 'button'; btn.textContent = '🛠';
  const panel = document.createElement('div'); panel.id = 'stf-panel';
  const lock = document.createElement('div'); lock.id = 'stf-lock';
  lock.innerHTML = '<div class="bx"><div class="t"></div><input type="password" inputmode="numeric" maxlength="4" autocomplete="off"><div class="msg"></div><button type="button">取消</button></div>';
  document.body.append(btn, panel, lock);
  const inp = lock.querySelector('input'), msg = lock.querySelector('.msg');

  groups.forEach(([title, items]) => {
    const g = document.createElement('div'); g.className = 'g';
    g.innerHTML = '<b>' + title + '</b>';
    items.forEach(([label, fn]) => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = label;
      b.onclick = e => { e.stopPropagation(); panel.classList.remove('open'); fn(); };
      g.appendChild(b);
    });
    panel.appendChild(g);
  });
  [btn, panel, lock].forEach(el => el.addEventListener('click', e => e.stopPropagation()));
  btn.onclick = e => { e.stopPropagation(); panel.classList.toggle('open'); };

  const apply = () => { const on = get(); btn.classList.toggle('on', on); if (!on) panel.classList.remove('open'); };
  const openLock = () => {
    lock.querySelector('.t').textContent = get() ? '輸入密碼關閉檢查點' : '輸入密碼開啟檢查點';
    inp.value = ''; msg.textContent = ''; lock.classList.add('open'); setTimeout(() => inp.focus(), 50);
  };
  inp.addEventListener('input', () => {
    inp.value = inp.value.replace(/\D/g, '').slice(0, 4);
    if (inp.value.length < 4) return;
    if (inp.value === STAFF_CODE){ set(!get()); apply(); lock.classList.remove('open'); }
    else { msg.textContent = '密碼不對喔'; inp.value = ''; }
  });
  lock.querySelector('button').onclick = () => lock.classList.remove('open');

  menuEl.addEventListener('click', e => { e.stopPropagation(); onOpen && onOpen(); openLock(); });
  apply();
}

(() => {
  const ready = () => new Promise(r => { const t = setInterval(() => {
    if ($('#loadText').classList.contains('ready')){ clearInterval(t); r(); } }, 100); });
  const setup = (nA, seeds, levels) => {
    if (!theme) theme = 'F';
    cards = [...THEMES[theme].cards, ...COMMON].map((code, i) => ({code,
      pile: i < nA ? 'a' : 'c', seeds: seeds ? (seeds[i] || 0) : 0, level: levels ? (levels[i] || 1) : 0}));
  };
  const go = fn => async () => {
    await ready(); document.querySelectorAll('.modal').forEach(m => m.classList.remove('show'));
    guard = false; $('#menuBtn').classList.add('show'); if (music) $('#musicBtn').classList.add('show');
    fn();
  };
  const T = k => go(() => { theme = k; });
  setupStaff($('#cmStaff'), [
    ['主題（先選，再跳畫面）', [['友情', T('F')], ['愛情', T('L')], ['未來規劃', T('P')], ['財務管理', T('M')], ['其他', T('O')]]],
    ['開始', [
      ['開場', () => location.reload()],
      ['準備對話', go(() => talk(TEXT.prep, TEXT.prepEnd, () => theme ? sortIntro() : chooseTheme()))],
      ['選主題', go(chooseTheme)] ]],
    ['分類', [
      ['分類說明', go(() => { if (!theme) theme = 'F'; sortIntro(); })],
      ['旋轉盤', go(() => { if (!theme) theme = 'F'; startSort(); })],
      ['超過5張選卡', go(() => { setup(7); startPick(); })] ]],
    ['種子與計分', [
      ['分配種子', go(() => { setup(3); startSeeds(); })],
      ['計分 Level', go(() => { setup(3, [5,3,2]); lvIdx = 0; renderLevel(); show('s-level'); })],
      ['樹枝動畫', go(() => { setup(3, [5,3,2], [3,2,1]); startScore(); })] ]],
    ['結果', [
      ['Level 1', go(() => { setup(3, [5,3,2], [1,2,3]); showResult(); })],
      ['Level 2', go(() => { setup(3, [5,3,2], [2,1,3]); showResult(); })],
      ['Level 3', go(() => { setup(3, [5,3,2], [3,1,1]); showResult(); })],
      ['同分隨機', go(() => { setup(3, [4,4,2], [3,3,1]); showResult(); })] ]]
  ], 'left:10px;bottom:calc(10px + env(safe-area-inset-bottom))', 'left:10px;bottom:calc(62px + env(safe-area-inset-bottom))', () => $('#cmenu').classList.remove('open'));
})();

window.addEventListener('resize', () => { if ($('#s-sort').classList.contains('show')) renderRing(); });
preload();
</script>
