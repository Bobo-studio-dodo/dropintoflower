<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3f6577">
<title>遺落成華｜購買卡牌</title>
<!--
  支線 C：購買卡牌
  - 商品照片：images/shop/photo1.webp ～ photo6.webp（網頁先用 webp，小很多；讀不到才用同名 .png）
    換照片時：放新的 .png，並把同名 .webp 刪掉或一起更新（不然會一直顯示舊的 webp）
  - 文字、價格、網址都在下方 <script> 最上面的 ✏️ 設定區
  - 「支持我們」區塊的 id 是 sponsor，排卡結果頁的贊助按鈕會直接跳到這裡
  - 顏色只用三種：深藍（主色、按鈕）、藍（一般文字）、紅（重點）；深藍底上用白字
-->
<style>
@font-face{font-family:"Chalk";src:url("fonts/HanyiSentyChalk-site.woff2") format("woff2");font-display:swap}
@font-face{font-family:"FYSong";src:url("fonts/FengYaSong-site.woff2") format("woff2");font-display:swap}  /* 猫啃网风雅宋（加寬10%網站版） */
:root{
  --main:#3f6577;     /* 主色：深藍（按鈕、標題、色塊） */
  --text:#3d5568;     /* 一般文字：藍 */
  --accent:#a85a54;   /* 重點：紅 */
  --line:rgba(63,101,119,.22);
  --paper:#f8f5ee;    /* 頁面底色 */
}
*{box-sizing:border-box;margin:0;padding:0}
html,*{touch-action:manipulation}   /* 快速連點不會放大；雙指縮放仍可使用 */
html{scroll-behavior:smooth}
html,body{max-width:100%;overflow-x:clip}   /* 手機不會左右滑動 */
body{font-family:"FYSong","Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;color:var(--text);background:var(--paper);
  font-size:clamp(18px,.5vw + 16px,22px);line-height:1.8}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3{font-weight:normal;color:var(--main);letter-spacing:.05em}
p,li,dd,h1,h2,h3{word-break:normal;overflow-wrap:anywhere;text-wrap:pretty;line-break:strict}
.nw{white-space:nowrap}   /* 這段文字不拆開（例：四大主題在｜處才換行） */
.notes h3{font-size:1.02em;color:var(--main);letter-spacing:.12em;margin:4px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.notes .grp + .grp{margin-top:22px}
.notes ul{list-style:none;display:grid;gap:10px}
.hid{display:none!important}

/* 上方列 */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) max(16px,4vw) 10px;background:var(--main);color:#fff}
.top a{color:#fff;text-decoration:none;font-size:clamp(17px,.4vw + 15px,20px);letter-spacing:.08em;
  font-family:"Chalk","PingFang TC","Microsoft JhengHei",sans-serif}

/* ───── 商品主區 ───── */
.hero{max-width:1120px;margin:0 auto;padding:clamp(18px,4vw,56px) max(16px,4vw);display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(20px,4vw,56px)}
.gallery,.info{min-width:0}
@media (min-width:860px){ .hero{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start} .gallery{position:sticky;top:80px} }

.main-img{position:relative;aspect-ratio:1;background:#fff;border-radius:6px;overflow:hidden}
.track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;touch-action:pan-x pan-y}
.track::-webkit-scrollbar{display:none}
.track img{flex:0 0 100%;width:100%;height:100%;object-fit:contain;scroll-snap-align:center;cursor:zoom-in}
.track .ph{flex:0 0 100%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:17px;color:var(--main);
  background:rgba(63,101,119,.06)}
.arr{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);
  color:var(--main);font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.arr.l{left:10px}.arr.r{right:10px}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.thumbs img{width:clamp(56px,14vw,84px);aspect-ratio:1;object-fit:cover;border-radius:4px;background:#fff;cursor:pointer;
  opacity:.55;border:2px solid transparent;flex:none}
.thumbs img.on{opacity:1;border-color:var(--main)}

.brand{color:var(--text);font-size:clamp(16px,.3vw + 14px,18px);letter-spacing:.12em}
h1{font-size:clamp(28px,1.2vw + 22px,40px);line-height:1.4;margin:4px 0 10px}
.price{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 14px}
.price b{font-weight:normal;font-size:clamp(34px,1.2vw + 28px,46px);color:var(--accent);line-height:1.2}
.price s{color:var(--text);opacity:.7}
.price-note{color:var(--accent);font-size:clamp(17px,.3vw + 15px,20px)}
.tagline{margin:18px 0 6px;font-size:clamp(19px,.5vw + 16px,24px);line-height:1.8}
.themes{color:var(--main);letter-spacing:.1em}
.btns{display:grid;gap:12px;margin:24px 0 10px}
.btn{display:block;width:100%;padding:.7em 1em;border-radius:6px;text-align:center;text-decoration:none;letter-spacing:.12em;
  font-size:clamp(20px,.5vw + 17px,24px);background:var(--main);color:#fff;border:2px solid var(--main);transition:filter .2s}
.btn:hover{filter:brightness(1.1)}
.btn.line{background:transparent;color:var(--main)}
.btn:disabled{opacity:.5}
.stock{color:var(--accent);text-align:center}

/* ───── 內容區（整條色塊、不加框） ───── */
.band{padding:clamp(40px,6vw,80px) max(18px,5vw)}
.band.white{background:#fff}
.inner{max-width:880px;margin:0 auto}
.band h2{font-size:clamp(25px,.9vw + 20px,34px);margin-bottom:18px;text-align:center}
.keywords{text-align:center;color:var(--main);font-size:clamp(20px,.6vw + 17px,26px);letter-spacing:.12em;margin-bottom:22px}
.points{list-style:none;display:grid;gap:14px;counter-reset:n}
@media (min-width:760px){ .points{grid-template-columns:1fr 1fr;gap:18px 40px} }
.points li{counter-increment:n;display:flex;gap:14px;align-items:baseline}
.points li::before{content:counter(n,decimal-leading-zero);color:var(--accent);font-size:1.3em;flex:none}
.spec{display:grid;grid-template-columns:auto 1fr}
.spec dt,.spec dd{padding:12px 0;border-bottom:1px solid var(--line)}
.spec dt{color:var(--main);padding-right:24px;white-space:nowrap}
.notes{max-width:40em;margin:0 auto}
.notes li{padding-left:1.2em;position:relative}
.notes li::before{content:"";position:absolute;left:0;top:.75em;width:.45em;height:.45em;border-radius:50%;background:var(--main)}
.notes li.em{color:var(--accent)}
.notes li.em::before{background:var(--accent)}

/* ───── 支持我們：深藍色塊、白字 ───── */
.band.dark{background:var(--main);color:#fff;font-family:"Chalk","PingFang TC","Microsoft JhengHei",sans-serif}
.band.dark h2{color:#fff}
.band.dark p{text-align:center}
.amount{display:flex;align-items:center;justify-content:center;gap:10px;margin:22px 0 12px}
.amount input{width:7em;padding:.3em .6em;border-radius:6px;border:0;background:#fff;color:var(--main);text-align:center;font-size:1.1em}
.copytext{max-width:560px;margin:0 auto 16px;padding:14px 18px;border:1px dashed rgba(255,255,255,.6);border-radius:6px;text-align:center}
.band.dark .btn{max-width:560px;margin:0 auto;background:#fff;color:var(--main);border-color:#fff}
.band.dark .small{margin-top:16px;opacity:.9;font-size:.92em}
.ok{min-height:1.6em;text-align:center;font-size:.9em}
.band.dark .ok{color:#fff}

.foot{text-align:center;padding:28px 16px calc(32px + env(safe-area-inset-bottom))}
.foot a{color:var(--main);font-size:clamp(19px,.4vw + 17px,22px);letter-spacing:.1em}

/* ───── 彈出視窗 ───── */
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(30,45,55,.55)}
.modal.show{display:flex}
.sheet{width:min(100%,560px);max-height:92dvh;overflow-y:auto;background:#fff;border-radius:8px;padding:clamp(22px,4vw,34px)}
.sheet h2{font-size:clamp(26px,1vw + 20px,32px);text-align:center;margin-bottom:10px}
.sheet .lead{font-size:.95em;margin-bottom:6px}
.sheet .copytext{border-color:var(--line);color:var(--text);margin:14px 0}
.field{display:block;margin-top:14px}
.field span{display:block;color:var(--main);margin-bottom:4px;font-size:.95em}
.field input,.field textarea,.field select{width:100%;padding:.45em .7em;border-radius:6px;border:1.5px solid var(--line);background:var(--paper);font-size:1em;color:var(--text)}
.field textarea{min-height:80px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:16px;color:var(--accent)}
.check input{width:20px;height:20px;margin-top:.35em;flex:none;accent-color:var(--main)}
.sheet .ok{color:var(--accent);margin-top:8px}
.sheet .btns{margin-top:14px}
#hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
#zoom{background:rgba(0,0,0,.88)}
#zoom img{max-width:100%;max-height:100%;object-fit:contain}
</style>
</head>
<body>
  <header class="top">
    <a href="index.html">⌂ 遺落成華</a>
    <a href="#sponsor">支持我們</a>
  </header>

  <!-- 商品主區 -->
  <section class="hero" id="shop">
    <div class="gallery">
      <div class="main-img">
        <div class="track" id="track"></div>
        <button class="arr l" id="prevPh" aria-label="上一張">‹</button>
        <button class="arr r" id="nextPh" aria-label="下一張">›</button>
      </div>
      <div class="thumbs" id="thumbs"></div>
    </div>

    <div class="info">
      <p class="brand" id="brand"></p>
      <h1 id="title"></h1>
      <div class="price"><b id="pSale"></b><s id="pOrig"></s></div>
      <p class="price-note" id="pNote"></p>
      <p class="tagline" id="tagline"></p>
      <p class="themes" id="themes"></p>
      <div class="btns">
        <button class="btn" id="openPre">填寫預購表單</button>
        <button class="btn line" id="openNow">現貨購買（私訊討論）</button>
      </div>
      <p class="stock" id="stock"></p>
    </div>
  </section>

  <!-- 卡牌特色 -->
  <section class="band white">
    <div class="inner">
      <h2>卡牌特色</h2>
      <p class="keywords" id="feature"></p>
      <ol class="points" id="points"></ol>
    </div>
  </section>

  <!-- 商品資訊 -->
  <section class="band">
    <div class="inner">
      <h2>商品資訊</h2>
      <dl class="spec" id="spec"></dl>
    </div>
  </section>

  <!-- 購買須知 -->
  <section class="band white">
    <div class="inner">
      <h2>購買須知</h2>
      <div class="notes" id="howto"></div>
    </div>
  </section>

  <!-- 支持我們 -->
  <section class="band dark" id="sponsor">
    <div class="inner">
      <h2>支持我們</h2>
      <p id="spText"></p>
      <div class="amount"><span>想贊助</span><input id="amt" type="number" inputmode="numeric" min="1" placeholder="金額"><span>元</span></div>
      <p class="copytext" id="spCopy"></p>
      <button class="btn" id="spCopyBtn">複製文字，並開啟 IG 私訊</button>
      <p class="ok" id="spMsg"></p>
      <p class="small" id="spOnsite"></p>
    </div>
  </section>

  <div class="foot"><a href="index.html">回到首頁</a></div>

  <!-- 現貨：私訊討論 -->
  <div class="modal" id="nowModal"><div class="sheet">
    <h2>現貨購買</h2>
    <p class="lead" id="nowText"></p>
    <p class="copytext" id="nowCopy"></p>
    <div class="btns">
      <button class="btn" id="nowCopyBtn">複製文字，並開啟 IG 私訊</button>
      <button class="btn line" data-close>關閉</button>
    </div>
    <p class="ok" id="nowMsg"></p>
  </div></div>

  <!-- 預購表單 -->
  <div class="modal" id="preModal"><div class="sheet">
    <h2>預購表單</h2>
    <p class="lead" id="preInfo"></p>
    <form id="preForm" novalidate>
      <label class="field"><span>姓名 *</span><input name="name" maxlength="20" autocomplete="name"></label>
      <label class="field"><span>手機 *（賣貨便取件通知用）</span><input name="phone" type="tel" inputmode="numeric" maxlength="10" placeholder="09xxxxxxxx" autocomplete="tel"></label>
      <label class="field"><span>IG 帳號或 Email *（出貨前聯絡用）</span><input name="contact" maxlength="60"></label>
      <label class="field"><span>數量 *</span>
        <select name="qty"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
      <label class="field"><span>7-11 取件門市 *（店名或店號）</span><input name="store" maxlength="40" placeholder="例：師大門市"></label>
      <label class="field"><span>備註</span><textarea name="note" maxlength="200"></textarea></label>
      <input id="hp" name="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <label class="check"><input type="checkbox" name="paid"><span id="paidText"></span></label>
      <p class="ok" id="preMsg"></p>
      <div class="btns">
        <button class="btn" type="submit" id="preSend">送出預購</button>
        <button class="btn line" type="button" data-close>關閉</button>
      </div>
    </form>
  </div></div>

  <div class="modal" id="zoom"><img alt=""></div>

<script>
/* =========================================================
   ✏️ 設定區：只要修改引號裡的文字
   ========================================================= */
const IG = 'below.regret';                                  // IG 帳號（私訊會開到這裡）
const BACKEND = 'https://script.google.com/macros/s/AKfycby0IrQq5lZt7b8Wv2QHy5VXmNtBHDzhBPWE1OdNWUV9PsJRWaI9b_J_NycdWC3zqk2d_w/exec';
const PHOTOS = ['photo1','photo2','photo3','photo4','photo5','photo6'];   // images/shop/ 裡的照片檔名（.png）

const SHOP = {
  brand: '花生什麼鳥事｜原創心靈卡牌',
  title: '《遺落成華》卡牌套組',
  priceSale: 'NT$ 899',
  priceOrig: '定價 NT$ 999',
  priceNote: '',                              // 價格下方的小字（空白＝不顯示）
  tagline: '遺憾會跨越時間，縈繞不散，<br>直到你願意直面它，把故事攤開。',
  themes: ['四大主題｜', '友情・愛情・未來規劃・財務管理'],   // 兩段各自不拆開，放不下時在｜處換行
  stock: '',                                   // 按鈕下方的小字（空白＝不顯示）
  feature: '遺憾解惑・心靈成長・自我療癒',
  points: [
    '一套寫給學生的「解憾」工具',
    '24 張因素卡，看見遺憾背後的現實面',
    '5 個步驟，解開打結的遺憾思緒',
    '10 分鐘，找到你沒發現的成長'
  ],
  spec: [
    ['內容物', '因素卡 24 張・引導手冊 1 本・種子 12 顆'],
    ['適合人數', '1 人'],
    ['體驗時間', '約 10 分鐘']
  ],
  howto: [                                   // 分成「現貨」「預購」兩組；開頭加上 ! 的那行會用紅色標示重點
    ['現貨', [
      '數量有限，請到攤位找我們，或私訊 IG 討論',
      '售價 899 元，以現金付款'
    ]],
    ['預購', [
      '!請先在攤位以現金付清 899 元，再填寫預購表單',
      '預購於展覽結束時截止，預計 2027 年 1 月出貨',
      '以 7-11 賣貨便寄送，運費由我們負擔'
    ]]
  ],

  nowText: '現貨數量有限，歡迎直接到攤位找我們，或複製下面的文字私訊我們的 IG 討論～',
  nowCopy: '你好！我想購買《遺落成華》卡牌套組現貨 1 份，想跟你們討論購買方式～',

  preInfo: '預購價 899 元／份，請先在攤位以現金付清。以 7-11 賣貨便寄送，運費由我們負擔，預計 2027 年 1 月出貨。',
  paidText: '我已在攤位以現金付清預購金額（899 元 × 數量）',

  spText: '在下面填入想贊助的金額，複製文字後私訊我們的 IG，我們會再提供收款帳號 🌷',
  spCopy: '你好！我想贊助你們 {amt} 元，想領取收款帳號～',
  spOnsite: '也歡迎到現場支持我們，購買周邊！'
};

/* =========================================================
   以下為程式，不需要修改
   ========================================================= */
const $ = s => document.querySelector(s);
const igDM = () => window.open('https://ig.me/m/' + IG, '_blank');
async function copy(text){
  try { await navigator.clipboard.writeText(text); return true; }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = 0;
    document.body.append(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch(_){} ta.remove(); return ok;
  }
}

/* 文字 */
$('#brand').textContent = SHOP.brand; $('#title').textContent = SHOP.title;
$('#pSale').textContent = SHOP.priceSale; $('#pOrig').textContent = SHOP.priceOrig; $('#pNote').textContent = SHOP.priceNote; $('#pNote').classList.toggle('hid', !SHOP.priceNote);
$('#tagline').innerHTML = SHOP.tagline; $('#themes').innerHTML = SHOP.themes.map(t => `<span class="nw">${t}</span>`).join('');
$('#stock').textContent = SHOP.stock; $('#stock').classList.toggle('hid', !SHOP.stock);
$('#feature').textContent = SHOP.feature;
$('#points').innerHTML = SHOP.points.map(t => `<li>${t}</li>`).join('');
$('#spec').innerHTML = SHOP.spec.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
$('#howto').innerHTML = SHOP.howto.map(([h, list]) => `<div class="grp"><h3>${h}</h3><ul>`
  + list.map(t => t[0] === '!' ? `<li class="em">${t.slice(1)}</li>` : `<li>${t}</li>`).join('') + '</ul></div>').join('');
$('#nowText').textContent = SHOP.nowText; $('#nowCopy').textContent = SHOP.nowCopy;
$('#preInfo').textContent = SHOP.preInfo; $('#paidText').textContent = SHOP.paidText;
$('#spText').textContent = SHOP.spText; $('#spOnsite').textContent = SHOP.spOnsite;

/* 照片：主圖可左右滑，下方縮圖可點選 */
const track = $('#track'), thumbs = $('#thumbs');
let shown = [];
PHOTOS.forEach((n, order) => {
  const img = new Image(); img.alt = '卡牌套組照片'; img.decoding = 'async'; img._order = order;
  img.onload = () => { shown.push(img); build(); };
  img.onerror = () => { if (img.src.endsWith('.webp')) img.src = 'images/shop/' + n + '.png'; };   // webp 讀不到 → 用 png
  img.src = 'images/shop/' + n + '.webp';
});
function build(){
  shown.sort((a, b) => a._order - b._order);
  track.replaceChildren(...shown);
  shown.forEach(img => img.onclick = () => { $('#zoom img').src = img.src; $('#zoom').classList.add('show'); });
  thumbs.replaceChildren(...(shown.length > 1 ? shown.map((im, i) => { const t = new Image(); t.src = im.src; t.alt = ''; t.onclick = () => go(i); return t; }) : []));
  $('#prevPh').classList.toggle('hid', shown.length < 2); $('#nextPh').classList.toggle('hid', shown.length < 2);
  mark();
}
const cur = () => Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
const go = i => track.scrollTo({ left: Math.max(0, Math.min(i, shown.length - 1)) * track.clientWidth, behavior: 'smooth' });
function mark(){ [...thumbs.children].forEach((t, i) => t.classList.toggle('on', i === cur())); }
track.addEventListener('scroll', () => requestAnimationFrame(mark));
$('#prevPh').onclick = () => go(cur() - 1);
$('#nextPh').onclick = () => go(cur() + 1);
setTimeout(() => { if (!shown.length){ track.innerHTML = '<div class="ph">商品照片<br>images/shop/photo1.png～photo6.png</div>';
  $('#prevPh').classList.add('hid'); $('#nextPh').classList.add('hid'); } }, 2500);
$('#zoom').onclick = () => $('#zoom').classList.remove('show');

/* 彈出視窗 */
const open = id => $(id).classList.add('show');
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('.modal').classList.remove('show'));
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); }));

/* 現貨：複製文字 + 開 IG */
$('#openNow').onclick = () => open('#nowModal');
$('#nowCopyBtn').onclick = async () => { const ok = await copy(SHOP.nowCopy); $('#nowMsg').textContent = ok ? '已複製！貼到 IG 私訊就可以了' : '請手動複製上面的文字'; igDM(); };

/* 贊助：金額 → 文字 → 複製 + 開 IG */
const spText = () => SHOP.spCopy.replace('{amt}', ($('#amt').value || '').trim() || '＿＿');
const updSp = () => $('#spCopy').textContent = spText();
$('#amt').addEventListener('input', updSp); updSp();
$('#spCopyBtn').onclick = async () => { const ok = await copy(spText()); $('#spMsg').textContent = ok ? '已複製！貼到 IG 私訊就可以了' : '請手動複製上面的文字'; igDM(); };

/* 預購表單 */
$('#openPre').onclick = () => open('#preModal');
$('#preForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, msg = $('#preMsg'), v = n => (f[n].value || '').trim();
  if (!v('name') || !v('contact') || !v('store')) { msg.textContent = '請填寫有 * 的欄位喔'; return; }
  if (!/^09\d{8}$/.test(v('phone'))) { msg.textContent = '手機號碼是 09 開頭的 10 碼數字'; return; }
  if (!f.paid.checked) { msg.textContent = '請先在攤位付款，再勾選確認喔'; return; }
  let last = 0; try { last = +localStorage.getItem('preLast') || 0; } catch(_){}
  if (Date.now() - last < 60000) { msg.textContent = '剛剛已經送出囉，稍等一分鐘再送吧～'; return; }
  $('#preSend').disabled = true; msg.textContent = '傳送中…';
  try {
    const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), 12000);
    await fetch(BACKEND, { method: 'POST', mode: 'no-cors', signal: ctrl.signal, headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ type: 'preorder', name: v('name'), phone: v('phone'), contact: v('contact'), qty: v('qty'),
        store: v('store'), note: v('note'), hp: v('hp') }) });
    clearTimeout(t);
    try { localStorage.setItem('preLast', Date.now()); } catch(_){}
    msg.textContent = '預購已送出！出貨前我們會再聯絡你 🌷';
    f.reset();
  } catch(err){ msg.textContent = '網路好像不太穩，請稍後再試一次'; }
  $('#preSend').disabled = false;
});
</script>
</body>
</html>
