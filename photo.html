<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3f6577">
<title>遺落成華｜打卡拍照</title>
<!--
  打卡拍照（濾鏡框）
  - 點相框圖片就會直接開啟相機；拍完或選完照片，同一頁出現「下載圖片」「複製打卡文字」
  - 濾鏡框：images/frames/frame1.png ～ frame4.png（1080×1920，中間挖空、背景透明）
  - 濾鏡名稱、打卡文字都在下方 <script> 最上面的 ✏️ 設定區
  - 相機需要 https 網址（放上 GitHub Pages 後就可以用；本機直接開檔案可能不能用相機）
  - 首頁相框連過來會帶 ?f=1~4，自動選框並開啟相機
-->
<style>
@font-face{font-family:"Chalk";src:url("fonts/HanyiSentyChalk-site.woff2") format("woff2");font-display:swap}
:root{--main:#3f6577;--text:#3d5568;--accent:#a85a54;--line:rgba(63,101,119,.22);--paper:#f8f5ee}
*{box-sizing:border-box;margin:0;padding:0}
html,*{touch-action:manipulation}
html,body{max-width:100%;overflow-x:clip}
body{min-height:100dvh;font-family:"Chalk","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--text);background:var(--paper);
  font-size:clamp(18px,.5vw + 15px,22px);line-height:1.8;display:flex;flex-direction:column;align-items:center}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
p,h1{word-break:keep-all;overflow-wrap:anywhere;text-wrap:pretty;line-break:strict}

/* 上方列（與購買頁相同） */
.top{position:sticky;top:0;z-index:20;width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) max(16px,4vw) 10px;background:var(--main);color:#fff}
.top a{color:#fff;text-decoration:none;font-size:clamp(17px,.4vw + 15px,20px);letter-spacing:.08em}

main{width:100%;max-width:640px;display:flex;flex-direction:column;align-items:center;gap:18px;
  padding:clamp(20px,3vw,36px) 16px calc(32px + env(safe-area-inset-bottom))}
h1{font-weight:normal;color:var(--main);font-size:clamp(25px,.9vw + 21px,32px);letter-spacing:.14em}
.sub{text-align:center}
.hint{font-size:.88em;text-align:center;opacity:.85}
.hid{display:none!important}

/* ───── 選框（點了直接開相機）───── */
.pick{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(10px,2.5vw,18px);width:100%}
@media (min-width:560px){ .pick{grid-template-columns:repeat(4,1fr)} }
.pick button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 8px 12px;border-radius:12px;
  background:#fff;box-shadow:0 3px 12px rgba(61,83,93,.14);transition:transform .15s}
.pick button:hover{transform:translateY(-3px)}
.pick button:active{transform:scale(.97)}
.pick img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:8px;background:var(--main)}
.pick .nm{font-size:clamp(17px,.4vw + 15px,20px);color:var(--main);letter-spacing:.08em}

/* ───── 9:16 畫面 ───── */
.stage{position:relative;width:min(100%, calc((100dvh - 330px) * 9 / 16), 400px);min-width:220px;aspect-ratio:9/16;
  border-radius:8px;overflow:hidden;background:#2b3a40;box-shadow:0 4px 16px rgba(61,83,93,.2)}
.stage video,.stage .frame,.stage .shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage video.mirror{transform:scaleX(-1)}
.stage .frame{object-fit:contain;pointer-events:none}
.stage .shot{display:none;object-fit:contain;background:#000;-webkit-touch-callout:default;user-select:auto}
.stage.done .shot{display:block}
.stage.done video,.stage.done .frame{visibility:hidden}
.stage .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;
  color:#fff;line-height:1.8;word-break:keep-all;overflow-wrap:anywhere;text-wrap:pretty}
.stage .count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:90px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.5)}

/* 換濾鏡的小縮圖 */
.thumbs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.thumbs button{width:70px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:clamp(14px,.3vw + 13px,16px);
  color:var(--text);padding:4px 2px;border-radius:8px;border:2px solid transparent}
.thumbs button.on{border-color:var(--main);color:var(--main)}
.thumbs .th{width:38px;aspect-ratio:9/16;border-radius:4px;background:var(--main) center/cover no-repeat}

/* ───── 按鈕 ───── */
.ctrl{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;width:100%}
.btn{flex:1 1 40%;max-width:300px;padding:.55em 1em;border-radius:6px;font-size:clamp(18px,.4vw + 16px,21px);text-align:center;text-decoration:none;
  background:var(--main);color:#fff;border:2px solid var(--main);letter-spacing:.08em}
.btn:hover{filter:brightness(1.08)}
.btn.line{background:transparent;color:var(--main)}
.btn.wide{flex-basis:100%}
.shutter{width:74px;height:74px;flex:none;border-radius:50%;background:#fff;border:7px solid var(--main);box-shadow:0 4px 10px rgba(0,0,0,.2)}
.textbtn{text-decoration:underline;text-underline-offset:4px;color:var(--main);font-size:clamp(17px,.4vw + 15px,20px)}

/* ───── 打卡文字：深藍色塊（同頁尾風格）───── */
.tagband{width:100%;background:var(--main);color:#fff;border-radius:12px;padding:clamp(20px,4vw,30px) clamp(16px,4vw,28px);text-align:center}
.tagband h2{font-weight:normal;font-size:clamp(20px,.6vw + 17px,25px);letter-spacing:.1em;margin-bottom:12px;
  padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.35)}
.tagband .tag{margin:0 auto 14px;max-width:460px;padding:12px 16px;border:1px dashed rgba(255,255,255,.6);border-radius:6px;user-select:text}
.tagband .btn{background:#fff;color:var(--main);border-color:#fff;max-width:320px;margin:0 auto;flex:none;width:100%;display:block}
.ok{min-height:1.5em;font-size:.88em;color:#fff;margin-top:8px}
#file{display:none}
</style>
</head>
<body>
  <header class="top"><a href="index.html">⌂ 遺落成華</a><a href="shop.html">購買卡牌</a></header>
  <main>
  <h1>打卡拍照</h1>

  <!-- ① 選框：點圖直接開相機 -->
  <section id="viewPick" style="display:contents">
    <p class="sub">點一張喜歡的花朵相框，<br>就會直接開啟相機囉！</p>
    <div class="pick" id="pick"></div>
    <button class="textbtn" id="pickFile">不拍照，從相簿選一張照片</button>
  </section>

  <!-- ② 相機 / ③ 成品 -->
  <section id="viewShot" class="hid" style="display:contents">
    <div class="stage" id="stage">
      <video id="video" playsinline muted></video>
      <img class="frame" id="frameImg" alt="">
      <img class="shot" id="shot" alt="打卡照片">
      <div class="msg" id="msg"></div>
      <div class="count" id="count"></div>
    </div>

    <div class="ctrl" id="ctrlCam">
      <button class="btn line" id="flip">切換鏡頭</button>
      <button class="shutter" id="snap" aria-label="拍照"></button>
      <button class="btn line" id="timer">倒數 3 秒：關</button>
      <button class="textbtn" id="backPick" style="flex-basis:100%">← 重新選相框</button>
    </div>

    <div class="ctrl hid" id="ctrlDone">
      <p class="hint" style="flex-basis:100%">手機可以長按照片儲存</p>
      <button class="btn" id="save">下載圖片</button>
      <button class="btn hid" id="share">分享</button>
      <button class="btn line" id="retake">重拍</button>
    </div>

    <div class="thumbs" id="thumbs"></div>

    <div class="tagband hid" id="tagband">
      <h2>複製文字，打卡去！</h2>
      <p class="tag" id="tagText"></p>
      <button class="btn" id="copyTag">複製打卡文字</button>
      <p class="ok" id="copyMsg"></p>
    </div>
  </section>

  </main>
  <input type="file" id="file" accept="image/*">

<script>
/* =========================================================
   ✏️ 設定區
   ========================================================= */
const FRAMES = [                       // 濾鏡框：檔名放在 images/frames/
  { file: 'frame1.png', name: '洋甘菊' },
  { file: 'frame2.png', name: '桔梗花' },
  { file: 'frame3.png', name: '繡球花' },
  { file: 'frame4.png', name: '櫻花' }
];
const TAG_TEXT = '我在 #遺落成華 #花生什麼鳥事 @below.regret';   // 打卡文字
const W = 1080, H = 1920;                                           // 輸出照片大小（9:16）

/* =========================================================
   以下為程式，不需要修改
   ========================================================= */
const $ = s => document.querySelector(s);
const stage = $('#stage'), video = $('#video'), frameImg = $('#frameImg'), shot = $('#shot'), msg = $('#msg');
let stream = null, facing = 'user', frameIdx = 0, useTimer = false, lastBlob = null, lastUrl = '', lastSource = null;
const show = (el, v = true) => el.classList.toggle('hid', !v);

/* 畫面切換：pick（選框）→ cam（相機）→ done（成品） */
function setView(v){
  show($('#viewPick'), v === 'pick');
  show($('#viewShot'), v !== 'pick');
  show($('#ctrlCam'), v === 'cam');
  show($('#ctrlDone'), v === 'done');
  show($('#tagband'), v === 'done');
  stage.classList.toggle('done', v === 'done');
  if (v === 'pick') stopCam();
}

/* 濾鏡框：原圖等選到才載入，省流量 */
const frameCache = {};
function ensureFrame(i){
  if (!frameCache[i]) frameCache[i] = new Promise(res => {
    const im = new Image();
    im.onload = () => res(im); im.onerror = () => res(null);
    im.src = 'images/frames/' + FRAMES[i].file;
  });
  return frameCache[i];
}
const thumbSrc = i => 'images/frames/thumb' + (i + 1) + '.webp';
$('#pick').innerHTML = FRAMES.map((f, i) =>
  `<button data-i="${i}" aria-label="用${f.name}相框拍照"><img src="${thumbSrc(i)}" alt="" onerror="this.src='images/frames/${f.file}';this.onerror=null"><span class="nm">${f.name}</span></button>`).join('');
$('#thumbs').innerHTML = FRAMES.map((f, i) =>
  `<button data-i="${i}"><span class="th" style="background-image:url('${thumbSrc(i)}'),url('images/frames/${f.file}')"></span>${f.name}</button>`).join('');
function pickFrame(i){
  frameIdx = i; ensureFrame(i); frameImg.src = 'images/frames/' + FRAMES[i].file;
  document.querySelectorAll('#thumbs button').forEach((b, k) => b.classList.toggle('on', k === i));
}
frameImg.onerror = () => frameImg.removeAttribute('src');
document.querySelectorAll('#pick button').forEach(b => b.onclick = () => { pickFrame(+b.dataset.i); setView('cam'); startCam(); });
document.querySelectorAll('#thumbs button').forEach(b => b.onclick = () => {
  pickFrame(+b.dataset.i);
  if (stage.classList.contains('done') && lastSource) compose(lastSource);   // 成品換框：直接重新合成
});
pickFrame(0);

/* 相機 */
async function startCam(){
  stopCam();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    msg.textContent = '這個瀏覽器不能使用相機，可以回上面「從相簿選照片」'; return;
  }
  msg.textContent = '正在開啟相機…';
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: false,
      video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 } } });
    video.srcObject = stream; await video.play();
    video.classList.toggle('mirror', facing === 'user');
    msg.textContent = '';
  } catch(e){
    msg.textContent = location.protocol === 'file:'
      ? '直接開檔案時不能用相機，放上網站（https）後就可以；現在可以先「從相簿選照片」'
      : '沒有取得相機權限。請在瀏覽器設定允許使用相機，或回上一步從相簿選照片';
  }
}
function stopCam(){ if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; } }
$('#flip').onclick = () => { facing = facing === 'user' ? 'environment' : 'user'; startCam(); };
$('#timer').onclick = () => { useTimer = !useTimer; $('#timer').textContent = '倒數 3 秒：' + (useTimer ? '開' : '關'); };
$('#backPick').onclick = () => setView('pick');

/* 拍照 */
$('#snap').onclick = async () => {
  if (!stream) return;
  if (useTimer){
    const c = $('#count'); c.style.display = 'flex';
    for (let n = 3; n > 0; n--){ c.textContent = n; await new Promise(r => setTimeout(r, 1000)); }
    c.style.display = 'none';
  }
  const cv = document.createElement('canvas'); cv.width = video.videoWidth; cv.height = video.videoHeight;
  const g = cv.getContext('2d');
  if (facing === 'user'){ g.translate(cv.width, 0); g.scale(-1, 1); }
  g.drawImage(video, 0, 0);
  lastSource = cv; stopCam(); compose(cv);
};

/* 從相簿選照片 */
$('#pickFile').onclick = () => $('#file').click();
$('#file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => { lastSource = img; compose(img); URL.revokeObjectURL(img.src); };
  img.src = URL.createObjectURL(f); e.target.value = '';
};

/* 合成：照片置中裁切成 9:16，再疊上濾鏡框 */
async function compose(src){
  const sw = src.videoWidth || src.naturalWidth || src.width, sh = src.videoHeight || src.naturalHeight || src.height;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  const s = Math.max(W / sw, H / sh), dw = sw * s, dh = sh * s;
  g.drawImage(src, (W - dw) / 2, (H - dh) / 2, dw, dh);
  const fr = await ensureFrame(frameIdx);
  if (fr) g.drawImage(fr, 0, 0, W, H);
  try { lastBlob = await new Promise(r => cv.toBlob(r, 'image/jpeg', .92)); }
  catch(e){ setView('cam'); msg.textContent = '直接開檔案時無法合成照片，放上網站（https）後就可以了'; return; }
  if (lastUrl) URL.revokeObjectURL(lastUrl);
  lastUrl = URL.createObjectURL(lastBlob);
  shot.src = lastUrl; msg.textContent = '';
  setView('done');
  show($('#share'), !!(navigator.canShare && navigator.canShare({ files: [new File([lastBlob], 'x.jpg', { type: 'image/jpeg' })] })));
}

/* 拍完：下載、分享、重拍 */
const fileName = () => '遺落成華打卡_' + new Date().toISOString().slice(0, 10) + '.jpg';
$('#save').onclick = () => {
  const a = document.createElement('a'); a.href = lastUrl; a.download = fileName(); document.body.append(a); a.click(); a.remove();
};
$('#share').onclick = async () => {
  try { await navigator.share({ files: [new File([lastBlob], fileName(), { type: 'image/jpeg' })], text: TAG_TEXT }); } catch(e){}
};
$('#retake').onclick = () => { lastSource = null; setView('cam'); startCam(); };

/* 打卡文字 */
$('#tagText').textContent = TAG_TEXT;
$('#copyTag').onclick = async () => {
  let ok = false;
  try { await navigator.clipboard.writeText(TAG_TEXT); ok = true; } catch(e){
    const ta = document.createElement('textarea'); ta.value = TAG_TEXT; document.body.append(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch(_){} ta.remove();
  }
  $('#copyMsg').textContent = ok ? '已複製！貼到 IG 限時動態或貼文就可以了' : '請長按上面的文字手動複製';
};

/* 從首頁相框連過來：?f=1~4 → 自動選框、直接開相機 */
const fParam = parseInt(new URLSearchParams(location.search).get('f'), 10);
if (fParam >= 1 && fParam <= FRAMES.length){ pickFrame(fParam - 1); setView('cam'); startCam(); }
else setView('pick');

window.addEventListener('pagehide', stopCam);
</script>
</body>
</html>
