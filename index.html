<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7eed0">
<title>遺落成華</title>

<!--
  ═══════════════ 檔案結構（請依此放置素材）═══════════════
  index.html                  ← 本頁（首頁）
  story.html                  ← 支線 A：小故事
  cards.html                  ← 支線 B：開始排卡(陣)
  quiz.html                   ← 支線 C：心理小測驗
  fonts/HanyiSentyCrayon-non-color.woff2
  images/background1.png      ← 背景（1920×1080）
  images/logo-vertical.png    ← 專案 logo（1283×1283，透明背景）
  images/btn-story.png        ← 支線 A：整張圖就是按鈕（長方形約 3.2:1，建議 1200×375，透明背景）
  images/btn-cards.png        ← 支線 B：同上
  images/btn-quiz.png         ← 支線 C：同上
  按鈕圖寬度由頁面控制、高度跟著圖走；手機一屏版面以約 3.2:1 計算（3:1～4:1 都可）。
  圖還沒放時，頁面會顯示色票佔位卡片，不會破圖。
-->

<style>
  @font-face {
    font-family: "HanyiSentyCrayon";
    src: url("fonts/HanyiSentyCrayon-non-color.woff2") format("woff2");
    font-display: swap;
  }

  :root {
    --blue:     #789baa;
    --rose:     #e1beb9;
    --cream:    #f7eed0;
    --blush:    #f1e0e4;
    --lavender: #ede2ef;
    --ink:      #3d535d;   /* 由 789baa 加深，供淺色底上的文字使用 */
    --font: "HanyiSentyCrayon", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;

    /* 按鈕顯示寬度（手機直式 / 橫式各自設定，要調大小改這裡） */
    --btn-w: min(88vw, 40svh, 440px);   /* 長條按鈕（約 3.2:1），手機一屏放得下 */
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }

  body {
    font-family: var(--font);
    color: var(--ink);
    background: var(--cream);
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }

  /* ───────── 背景（images/background1.png，1920×1080）─────────
     上層：完整顯示整張圖。下層：同圖放大模糊後鋪滿，讓任何比例都能延伸。
     想改成滿版裁切：把 .bg::after 的 contain 改成 cover。 */
  .bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    background: linear-gradient(160deg, var(--cream) 0%, var(--blush) 45%, var(--lavender) 100%);
  }
  .bg::before,
  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: url("images/background1.png") center / cover no-repeat;
  }
  .bg::before { filter: blur(28px) saturate(0.95); transform: scale(1.12); }
  .bg::after  { background-size: cover; }

  /* ───────── 版面 ───────── */
  .page {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(16px, 3.5svh, 40px);
    padding:
      max(20px, env(safe-area-inset-top))
      max(20px, env(safe-area-inset-right))
      max(28px, env(safe-area-inset-bottom))
      max(20px, env(safe-area-inset-left));
  }

  /* ───────── Logo（1283×1283，置中）───────── */
  .logo {
    width: clamp(120px, min(78vw, 36svh), 440px);
    aspect-ratio: 1;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: float 6s ease-in-out infinite;
  }
  .logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .logo.is-empty img { display: none; }
  .logo-fallback { display: none; }
  .logo.is-empty .logo-fallback {
    display: block;
    writing-mode: vertical-rl;
    font-size: clamp(44px, 9svh, 84px);
    letter-spacing: 0.3em;
    color: var(--blue);
    padding: 0.4em 0.5em;
    border-left: 3px solid var(--rose);
    border-right: 3px solid var(--rose);
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }

  /* ───────── 三個按鈕：整張圖就是按鈕 ───────── */
  .branches {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;     /* 手機直式：直排，一屏看完 */
    align-items: center;
    gap: clamp(8px, 1.6svh, 16px);
  }

  .branch {
    display: block;
    width: var(--btn-w);
    color: var(--ink);
    text-decoration: none;
    border-radius: 24px;
    transition: transform 0.18s ease, filter 0.18s ease;
  }
  .branch img { display: block; width: 100%; height: auto; }
  .branch:hover  { transform: translateY(-4px) scale(1.02); filter: drop-shadow(0 8px 10px rgba(61, 83, 93, 0.28)); }
  .branch:active { transform: scale(0.98); filter: none; }
  .branch:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }

  /* 圖還沒放時的佔位卡片 */
  .fallback { display: none; }
  .branch.is-empty img { display: none; }
  .branch.is-empty .fallback {
    display: flex;
    flex-direction: row;
    align-items: baseline;
    justify-content: center;
    align-content: center;
    gap: 14px;
    aspect-ratio: 16 / 5;
    text-align: center;
    background: var(--blush);
    border: 3px solid var(--blue);
    border-radius: 24px;
  }
  .fallback { padding: 0 14px; }
  .fallback b { font-weight: normal; font-size: 1.35rem; }
  .fallback small { font-size: 1rem; color: var(--blue); }

  /* ───────── 橫式（電腦 / 平板 / 手機橫放）：按鈕排成一列 ───────── */
  @media (orientation: landscape) and (min-width: 640px) {
    :root { --btn-w: min(29vw, 400px); }
    .page { gap: clamp(10px, 2.5svh, 30px); }
    .logo { width: clamp(150px, min(50svh, 44vw), 460px); }
    .branches { flex-direction: row; align-items: flex-start; gap: clamp(8px, 2vw, 28px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .logo { animation: none; }
    .branch { transition: none; }
  }
</style>
</head>

<body>
  <div class="bg" aria-hidden="true"></div>

  <main class="page">

    <h1 class="logo">
      <img src="images/logo-vertical.png" alt="遺落成華"
           onerror="this.parentElement.classList.add('is-empty')">
      <span class="logo-fallback">遺落成華</span>
    </h1>

    <ul class="branches">
      <li>
        <a class="branch" href="story.html" aria-label="小故事：前言故事">
          <img src="images/btn-story.png" alt=""
               onerror="this.parentElement.classList.add('is-empty')">
          <span class="fallback"><b>小故事</b><small>前言故事</small></span>
        </a>
      </li>
      <li>
        <a class="branch" href="cards.html" aria-label="開始排卡：線上卡牌互動">
          <img src="images/btn-cards.png" alt=""
               onerror="this.parentElement.classList.add('is-empty')">
          <span class="fallback"><b>開始排卡</b><small>線上卡牌互動</small></span>
        </a>
      </li>
      <li>
        <a class="branch" href="quiz.html" aria-label="心理小測驗：看見此刻的心情">
          <img src="images/btn-quiz.png" alt=""
               onerror="this.parentElement.classList.add('is-empty')">
          <span class="fallback"><b>心理小測驗</b><small>看見此刻的心情</small></span>
        </a>
      </li>
    </ul>

  </main>
</body>
</html>
